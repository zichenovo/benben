<!DOCTYPE html>

<html lang="zh">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>bbti</title>

<style>

body{

    margin:0;

    width:100%;

    height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    flex-direction:column;

    background:
    linear-gradient(
    to bottom right,
    #f8f2f3,
    #f5efef,
    #f6f1f7
    );

    font-family:
    "Times New Roman",
    "STSong",
    serif;

    overflow:hidden;
}

/* 返回歌单 */

.back-btn{

    position:fixed;

    top:34px;

    left:38px;

    z-index:999999;

    color:#b1969f;

    font-size:20px;

    font-style:italic;

    cursor:pointer;

    user-select:none;

    transition:0.3s;
}

.back-btn:hover{

    color:#d5aebe;

    transform:translateX(-4px);
}

/* title */

.title{

    font-size:64px;

    color:#9f8892;

    font-style:italic;

    font-weight:400;

    letter-spacing:1px;

    transition:0.3s;
}

/* subtitle */

.sub{

    margin-top:22px;

    font-size:17px;

    color:#c5b2bb;

    letter-spacing:6px;

    font-style:italic;

    transition:0.3s;
}

/* arrow */

.arrow{

    margin-top:30px;

    font-size:36px;

    color:#ceb7c1;

    cursor:pointer;

    transition:0.3s;

    animation:
    move 1.6s infinite;

    user-select:none;
}

.arrow:hover{

    color:#b89ca8;

    transform:scale(1.08);
}

/* animation */

@keyframes move{

    0%{

        transform:
        translateX(0px);
    }

    50%{

        transform:
        translateX(12px);
    }

    100%{

        transform:
        translateX(0px);
    }
}

/* 手机 */

@media(max-width:768px){

    .back-btn{

        top:24px;

        left:20px;

        font-size:15px;
    }

    .title{

        font-size:42px;

        text-align:center;

        line-height:1.4;
    }

    .sub{

        font-size:13px;

        letter-spacing:4px;
    }

    .arrow{

        font-size:30px;

        margin-top:24px;
    }
}

.book-button{

    position:fixed;

    top:38px;
    right:38px;

    width:72px;
    height:72px;

    border-radius:50%;

    border:1.5px solid #ddd1d6;

    display:flex;

    align-items:center;
    justify-content:center;

    background:rgba(255,255,255,0.28);

    backdrop-filter:blur(10px);

    transition:0.3s;

    text-decoration:none;
}

.book-button:hover{

    transform:scale(1.05);

    background:rgba(255,255,255,0.45);

    border-color:#cdbec4;
}

/* 手机 */

@media(max-width:768px){

    .book-button{

        width:58px;
        height:58px;

        top:20px;
        right:20px;
    }

    .book-button svg{

        width:28px;
        height:28px;
    }
}
  

</style>

</head>

<body>

<div
class="back-btn"

onclick="
window.location.href='index.html?entered=true'
">

← 返回歌单

</div>

<div class="title">

测测你的 bbti

</div>

<div class="sub">

click to enter

</div>

<div
class="arrow"

onclick="
window.location.href='test.html'
">

⟶

</div>

<audio
id="bgm"
src="bgm.mp3"
loop
style="display:none">
</audio>

<script>

const bgm =
document.getElementById("bgm");

/* 恢复播放时间 */

const savedTime =
localStorage.getItem("bgmTime");

if(savedTime){

    bgm.currentTime =
    parseFloat(savedTime);
}

/* 是否继续播放 */

const shouldPlay =
localStorage.getItem("bgmPlaying");

if(
shouldPlay === "true"
){

    bgm.play();
}

/* 实时记录时间 */

setInterval(()=>{

    localStorage.setItem(
    "bgmTime",
    bgm.currentTime
    );

},1000);

</script>

<a href="bbti-book.html" class="book-button">

<svg width="34" height="34" viewBox="0 0 24 24" fill="none">

<path d="M3 5.5C3 4.67 3.67 4 4.5 4H10C11.1 4 12 4.9 12 6V20C12 18.9 11.1 18 10 18H4.5C3.67 18 3 18.67 3 19.5V5.5Z"
stroke="#cdbdc4"
stroke-width="1.4"/>

<path d="M21 5.5C21 4.67 20.33 4 19.5 4H14C12.9 4 12 4.9 12 6V20C12 18.9 12.9 18 14 18H19.5C20.33 18 21 18.67 21 19.5V5.5Z"
stroke="#cdbdc4"
stroke-width="1.4"/>

</svg>

</a>

</body>

</html>
