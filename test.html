<!DOCTYPE html>
<html lang="zh">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>wwti Test</title>

<style>

body{

    margin:0;

    background:#f8f2f3;

    font-family:
    "Times New Roman",
    "STSong",
    serif;

    color:#9f8b94;

    overflow:hidden;
}

.container{

    width:88%;

    max-width:560px;

    margin:auto;

    margin-top:70px;
}

.top{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:40px;
}

.back{

    font-size:18px;

    cursor:pointer;

    opacity:0.75;
}

.back:hover{

    opacity:1;
}

.finish{

    font-size:18px;

    cursor:pointer;

    opacity:0.75;
}

.finish:hover{

    opacity:1;
}

.question-number{

    font-size:16px;

    letter-spacing:2px;

    margin-bottom:18px;

    opacity:0.65;
}

.question{

    font-size:34px;

    line-height:1.5;

    margin-bottom:42px;

    font-style:italic;
}

.answers{

    display:flex;

    flex-direction:column;

    gap:16px;
}

.answer{

    background:
    rgba(255,255,255,0.5);

    border-radius:24px;

    padding:20px 24px;

    font-size:20px;

    cursor:pointer;

    transition:0.3s;

    backdrop-filter:blur(10px);
}

.answer:hover{

    transform:translateY(-3px);

    background:
    rgba(255,255,255,0.72);
}

.answer.selected{

    background:
    rgba(255,255,255,0.92);

    border:
    1.5px solid rgba(216,182,196,0.65);

    color:#b58d9f;

    transform:translateY(-2px);

    box-shadow:

    0 0 22px rgba(255,255,255,0.65),

    0 0 30px rgba(230,200,220,0.18);
}
/* 返回歌单 */

.home-btn{

    position:fixed;

    left:24px;
    bottom:26px;

    width:52px;
    height:52px;

    border-radius:50%;

    background:
    rgba(255,255,255,0.55);

    backdrop-filter:blur(12px);

    display:flex;

    justify-content:center;
    align-items:center;

    color:#ab939d;

    font-size:28px;

    text-decoration:none;

    z-index:9999;

    box-shadow:
    0 0 18px rgba(255,255,255,0.45);

    transition:0.3s;
}

.home-btn:hover{

    transform:scale(1.08);

    background:
    rgba(255,255,255,0.8);
}

@media(max-width:768px){

    .container{

        margin-top:50px;
    }

    .question{

        font-size:28px;
    }

    .answer{

        font-size:18px;

        padding:18px 20px;
    }
}

</style>

</head>

<body>

<div class="container">

    <div class="top">

        <div
        class="back"
        id="backBtn">

        </div>

        <div
        class="finish"
        id="finishBtn">

        </div>

    </div>

    <div
    class="question-number"
    id="questionNumber">
    </div>

    <div
    class="question"
    id="question">
    </div>

    <div
    class="answers"
    id="answers">
    </div>

</div>

<script>

const questions = [

{
q:"凌晨两点睡不着时，你会：",
a:[
"听歌",
"翻聊天记录",
"发呆",
"给别人发消息"
]
},

{
q:"你更喜欢：",
a:[
"海边",
"雨天",
"深夜便利店",
"日落"
]
},

{
q:"别人最常说你：",
a:[
"很温柔",
"情绪很多",
"有点奇怪",
"看不透"
]
},

{
q:"收到喜欢的人消息时，你会：",
a:[
"秒回",
"假装冷静",
"反复看很多遍",
"故意晚点回"
]
},

{
q:"你最容易在什么时候 emo：",
a:[
"回家路上",
"洗澡的时候",
"半夜",
"听到某首歌时"
]
},

{
q:"吻的生日是：",
a:[
"3.19",
"6.2",
"2.20",
"12.25"
]
},

{
q:"如果只能留下一个，你会选：",
a:[
"回忆",
"自由",
"被爱",
"安静"
]
},

{
q:"请选择一句最像你的话：",
a:[
"我经常假装没事。",
"我只是想被坚定地选择一次。",
"我总活在自己的世界里。",
"有些情绪我连自己都说不清。"
]
},

{
q:"你觉得吻是一个怎样的人：",
a:[
"好人",
"坏人",
"不直豆"
]
}

];

const results = [

{
name:"吻文而雅",
text:"吻总把喜欢说得很温柔"
},

{
name:"不闻不吻",
text:"其实你很在意吻的 对不对"
},

{
name:"吻风而来",
text:"把吻藏进风里"
},

{
name:"百吻不如一见",
text:"想吻ta的话 就见一面吧"
},

{
name:"十拿九吻",
text:"吻吻的？稳稳的！"
},

{
name:"吻酒煮月",
text:"吻一口月亮"
},

{
name:"吻故而知新",
text:"每次想起吻都会开心一点"
},

{
name:"人间能得几回吻",
text:"会好好珍惜那个吻的"
}

];

let current = 0;

let answers = [];

const question =
document.getElementById("question");

const answersWrap =
document.getElementById("answers");

const questionNumber =
document.getElementById("questionNumber");

const backBtn =
document.getElementById("backBtn");

const finishBtn =
document.getElementById("finishBtn");

function renderQuestion(){

    const q =
    questions[current];

    question.innerText =
    q.q;

    questionNumber.innerText =
    `Q${current+1}`;

    answersWrap.innerHTML = "";

    q.a.forEach((item,index)=>{

        const div =
        document.createElement("div");

        div.className =
        "answer";

        /* 如果之前选过 */

    if(answers[current] === index){

        div.classList.add(
        "selected"
        );
    }

        div.innerText =
        String.fromCharCode(65+index)
        + ". "
        + item;

        div.onclick = ()=>{

            answers[current] = index;

            if(current < questions.length-1){

                current++;

                renderQuestion();

        }else{

        /* 最后一题只记录答案 */

            renderQuestion();
        }
        };

        answersWrap.appendChild(div);
    });

    if(current === 0){

        backBtn.innerText = "";

    }else{

        backBtn.innerText =
        "← 返回上一题";
    }

    if(current === questions.length-1){

        finishBtn.innerText =
        "✓ 完成答题";

    }else{

        finishBtn.innerText =
        "前往下一题 →";
    }
}

backBtn.onclick = ()=>{

    if(current > 0){

        current--;

        renderQuestion();
    }
};

finishBtn.onclick = ()=>{

    /* 不是最后一题 */

    if(current < questions.length-1){

        current++;

        renderQuestion();

        return;
    }

    /* 最后一题才检查 */

    if(

    answers.length < questions.length

    ||

    answers.includes(undefined)

    ){

        alert(
        "TuT 还没有答完！\n不许完成！"
        );

        return;
    }

    finishTest();
};


        

   

function finishTest(){

    let score = 0;

    answers.forEach(a=>{

        score += a;
    });

    const type =
    results[
    score % results.length
    ];

    const percent =
    70 + Math.floor(Math.random()*31);

    window.location.href =

    "result.html?"

    + "type="

    + encodeURIComponent(type.name)

    + "&text="

    + encodeURIComponent(type.text)

    + "&percent="

    + percent;
}

renderQuestion();

</script>

<a
href="index.html?entered=true"

class="home-btn"

onclick="
localStorage.setItem('bgmPlaying','true');
"
>

⌂

</a>



</body>

</html>
