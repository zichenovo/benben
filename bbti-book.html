<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>bbti图鉴</title>

<style>

body{
    margin:0;
    background:#f8f4f5;
    font-family: "STSong";
}

.title{
    text-align:center;
    margin-top:80px;
    color:#b89ca7;
    font-size:48px;
    letter-spacing:4px;
}

.card-container{
    width:80%;
    margin:80px auto;

    display:grid;
    grid-template-columns: repeat(4,1fr);
    gap:40px;
}

.card{
    background:white;

    border-radius:30px;

    padding:20px;

    text-align:center;

    box-shadow:
    0 4px 20px rgba(0,0,0,0.05);

    transition:0.3s;
}

.card:hover{
    transform:translateY(-8px);
}

.card img{
    width:100%;
    border-radius:20px;
}

.card-name{
    margin-top:20px;
    font-size:28px;
    color:#444;
}

</style>
</head>

<body>

<div class="title">
bbti 图鉴
</div>

<div class="card-container">

<div class="card">
<img src="images/1.jpg">
<div class="card-name">笨来如此</div>
</div>

<div class="card">
<img src="images/2.jpg">
<div class="card-name">一笨正经</div>
</div>

<div class="card">
<img src="images/3.jpg">
<div class="card-name">嫦娥笨月</div>
</div>

<div class="card">
<img src="images/4.jpg">
<div class="card-name">四海为笨</div>
</div>

<div class="card">
<img src="images/5.jpg">
<div class="card-name">笨末倒置</div>
</div>

<div class="card">
<img src="images/6.jpg">
<div class="card-name">夜笨三更</div>
</div>

<div class="card">
<img src="images/7.jpg">
<div class="card-name">笨不住了</div>
</div>

<div class="card">
<img src="images/8.jpg">
<div class="card-name">笨来爱你</div>
</div>

</div>

</body>
</html>
