<!DOCTYPE html>
<html lang="zh">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="
width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>歌曲详情</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link href="
https://fonts.googleapis.com/css2?
family=Cormorant+Garamond:wght@300;400;500&
family=Noto+Serif+SC:wght@300;400;500&
display=swap"
rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    overflow:hidden;

    width:100vw;
    height:100vh;

    background:
    radial-gradient(
    circle at center,
    rgba(236,230,255,0.7),
    rgba(250,245,248,1) 70%);

    font-family:
    'Cormorant Garamond',
    'Noto Serif SC',
    serif;

    animation:
    bgMove 10s ease-in-out infinite alternate;
}

@keyframes bgMove{

    from{
        filter:hue-rotate(0deg);
    }

    to{
        filter:hue-rotate(8deg);
    }
}

/* 主区域 */

.container{

    width:92%;
    height:88vh;

    position:relative;

    margin:auto;
    margin-top:4vh;

    border-radius:42px;

    overflow:hidden;

    background:
    rgba(255,255,255,0.34);

    backdrop-filter:blur(12px);

    box-shadow:
    0 0 60px rgba(230,210,255,0.15) inset,
    0 0 40px rgba(255,255,255,0.4);
}

/* 返回 */

.back{

    position:absolute;

    top:34px;
    left:34px;

    text-decoration:none;

    color:#a5959e;

    font-size:20px;

    z-index:50;

    transition:0.3s;
}

.back:hover{

    opacity:0.7;
}

/* 标题 */

.song-title{

    position:absolute;

    top:72px;
    left:38px;

    font-size:28px;

    font-style:italic;

    font-weight:500;

    color:#9f8f99;

    letter-spacing:1px;

    z-index:999;

    text-shadow:
    0 0 18px rgba(255,255,255,0.45);
}

/* 中间 */

.center{

    position:absolute;

    left:50%;
    top:55%;

    transform:
    translate(-50%,-50%);

    display:flex;
    flex-direction:column;
    align-items:center;
}

/* glow */

.glow{

    position:absolute;

    width:520px;
    height:520px;

    border-radius:50%;

    background:
    radial-gradient(
    circle,
    rgba(228,215,255,0.42),
    rgba(255,255,255,0));

    filter:blur(50px);

    animation:
    pulse 5s ease-in-out infinite alternate;
}

@keyframes pulse{

    from{

        transform:scale(0.9);
        opacity:0.5;
    }

    to{

        transform:scale(1.08);
        opacity:0.9;
    }
}

/* 黑胶 */

.record{

    width:360px;
    height:360px;

    border-radius:50%;

    position:relative;

    animation:
    spin 12s linear infinite;

    background:
    radial-gradient(circle,
    #111 0%,
    #111 12%,
    #f6f6f6 13%,
    #ececec 32%,
    #fafafa 52%,
    #efefef 74%,
    #ffffff 100%);

    box-shadow:
    0 0 60px rgba(255,255,255,0.8),
    0 0 40px rgba(220,220,255,0.5);
}

.record::before{

    content:"";

    position:absolute;

    inset:18px;

    border-radius:50%;

    border:
    1px solid rgba(255,255,255,0.45);
}

.record::after{

    content:"";

    position:absolute;

    top:50%;
    left:50%;

    transform:
    translate(-50%,-50%);

    width:26px;
    height:26px;

    border-radius:50%;

    background:#111;
}

@keyframes spin{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}

/* 播放器 */

audio{

    margin-top:42px;

    width:360px;

    opacity:0.74;
}

/* 音符 */

.note{

    position:absolute;

    color:#eadfff;

    pointer-events:none;

    animation:
    depthMove linear infinite;
}

@keyframes depthMove{

    0%{

        transform:
        translateZ(-500px)
        scale(0.3);

        opacity:0;
    }

    20%{
        opacity:0.24;
    }

    100%{

        transform:
        translateZ(300px)
        scale(1.8);

        opacity:0;
    }
}

/* ====================== */
/* 手机适配 */
/* ====================== */

@media (max-width:768px){

.container{

    width:94%;
    height:92vh;

    margin-top:2vh;

    border-radius:26px;
}

.back{

    top:26px;
    left:22px;

    font-size:18px;
}

.song-title{

    top:54px;
    left:24px;

    font-size:22px;

    font-weight:500;

    line-height:1.4;
}

.center{

    top:56%;
}

.glow{

    width:300px;
    height:300px;
}

.record{

    width:220px;
    height:220px;
}

.record::before{

    inset:12px;
}

.record::after{

    width:18px;
    height:18px;
}

audio{

    width:280px;

    margin-top:28px;
}

.note{

    opacity:0.12;
}

}

</style>
</head>

<body>

<div class="container">

<a href="index.html"
class="back">

← 返回歌单

</a>

<div class="song-title"
id="songTitle">

歌曲

</div>

<div class="center">

<div class="glow"></div>

<div class="record"></div>

<audio controls id="player">
</audio>

</div>

</div>

<script>

/* 获取歌曲名 */

const params =
new URLSearchParams(
window.location.search
);

const song =
params.get("song") || "歌曲";

/* 设置标题 */

document
.getElementById("songTitle")
.innerText =
"正在播放：《" + song + "》";

/* 获取播放器 */

const player =
document.getElementById("player");

/* 音频映射 */

const songMap = {

    "take me hand":
    "audioSource/take me hand.mp3",

    "空空":
    "audioSource/空空.mp3",

    "梁山伯与茱丽叶":
    "audioSource/梁山伯与茱丽叶.mp3",

};

/* 加载音频 */

if(songMap[song]){

    player.innerHTML =

    '<source src="' +
    songMap[song] +
    '" type="audio/mpeg">';

    player.load();
}

/* 音符 */

const symbols =
["♫","♪","♬","♩"];

for(let i=0;i<26;i++){

    const note =
    document.createElement("div");

    note.className="note";

    note.innerHTML =
    symbols[
    Math.floor(
    Math.random()*symbols.length
    )];

    note.style.left =
    Math.random()*100 + "vw";

    note.style.top =
    Math.random()*100 + "vh";

    note.style.fontSize =
    (18+Math.random()*60) + "px";

    note.style.animationDuration =
    (4+Math.random()*6) + "s";

    note.style.animationDelay =
    (-Math.random()*10) + "s";

    note.style.opacity =
    Math.random()*0.24;

    document.body.appendChild(note);
}

</script>

</body>
</html>
