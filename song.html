<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>歌曲详情</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Noto+Serif+SC:wght@300;400&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    overflow:hidden;

    width:100vw;
    height:100vh;

    background:
    radial-gradient(circle at center,
    rgba(236,230,255,0.7),
    rgba(250,245,248,1) 70%);

    font-family:
    'Cormorant Garamond',
    'Noto Serif SC',
    serif;

    animation:
    bgMove 10s ease-in-out infinite alternate;
}

@keyframes bgMove{

    from{
        filter:hue-rotate(0deg);
    }

    to{
        filter:hue-rotate(8deg);
    }
}

.container{

    width:92%;
    height:88vh;

    position:relative;

    margin:auto;
    margin-top:4vh;

    border-radius:42px;

    overflow:hidden;

    background:
    rgba(255,255,255,0.34);

    backdrop-filter:blur(12px);

    box-shadow:
    0 0 60px rgba(230,210,255,0.15) inset,
    0 0 40px rgba(255,255,255,0.4);
}

.back{

    position:absolute;

    top:40px;
    left:55px;

    text-decoration:none;

    color:#a5959e;

    font-size:34px;

    z-index:50;
}

.song-title{

    position:absolute;

    top:52px;
    left:320px;

    font-size:24px;

    font-style:italic;

    font-weight:300;

    color:#a998a2;

    letter-spacing:1px;

    z-index:999;

    text-shadow:
    0 0 18px rgba(255,255,255,0.45);
}

.center{

    position:absolute;

    left:50%;
    top:55%;

    transform:translate(-50%,-50%);

    display:flex;
    flex-direction:column;
    align-items:center;
}

.glow{

    position:absolute;

    width:520px;
    height:520px;

    border-radius:50%;

    background:
    radial-gradient(circle,
    rgba(228,215,255,0.42),
    rgba(255,255,255,0));

    filter:blur(50px);

    animation:
    pulse 5s ease-in-out infinite alternate;
}

@keyframes pulse{

    from{
        transform:scale(0.9);
        opacity:0.5;
    }

    to{
        transform:scale(1.08);
        opacity:0.9;
    }
}

.record{

    width:360px;
    height:360px;

    border-radius:50%;

    position:relative;

    animation:
    spin 12s linear infinite;

    background:
    radial-gradient(circle,
    #111 0%,
    #111 12%,
    #f6f6f6 13%,
    #ececec 32%,
    #fafafa 52%,
    #efefef 74%,
    #ffffff 100%);

    box-shadow:
    0 0 60px rgba(255,255,255,0.8),
    0 0 40px rgba(220,220,255,0.5);
}

.record::before{

    content:"";

    position:absolute;

    inset:18px;

    border-radius:50%;

    border:
    1px solid rgba(255,255,255,0.45);
}

.record::after{

    content:"";

    position:absolute;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    width:26px;
    height:26px;

    border-radius:50%;

    background:#111;
}

@keyframes spin{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}

audio{

    margin-top:42px;

    width:360px;

    opacity:0.74;
}

.note{

    position:absolute;

    color:#eadfff;

    pointer-events:none;

    animation:
    depthMove linear infinite;
}

@keyframes depthMove{

    0%{

        transform:
        translateZ(-500px)
        scale(0.3);

        opacity:0;
    }

    20%{
        opacity:0.24;
    }

    100%{

        transform:
        translateZ(300px)
        scale(1.8);

        opacity:0;
    }
}

</style>
</head>

<body>

<div class="container">

<a href="index.html" class="back">
← 返回歌单
</a>

<div class="song-title" id="songTitle">
歌曲
</div>

<div class="center">

<div class="glow"></div>

<div class="record"></div>

<audio controls id="player">
</audio>

</div>

</div>

<script>

const params =
new URLSearchParams(window.location.search);

const song =
params.get("song") || "歌曲";

document.getElementById("songTitle")
.innerText =
"正在播放：《" + song + "》";

/* 音频 */

if(song === "take me hand"){

    document
    .getElementById("player")
    .innerHTML =

    '<source src="audioSource/take me hand.mp3" type="audio/mpeg">';
}

if(song === "空空"){

    document
    .getElementById("player")
    .innerHTML =

    '<source src="audioSource/空空.mp3" type="audio/mpeg">';
}

const symbols =
["♫","♪","♬","♩"];

for(let i=0;i<26;i++){

    const note =
    document.createElement("div");

    note.className="note";

    note.innerHTML=
    symbols[Math.floor(Math.random()*symbols.length)];

    note.style.left=
    Math.random()*100+"vw";

    note.style.top=
    Math.random()*100+"vh";

    note.style.fontSize=
    (18+Math.random()*60)+"px";

    note.style.animationDuration=
    (4+Math.random()*6)+"s";

    note.style.animationDelay=
    (-Math.random()*10)+"s";

    note.style.opacity=
    Math.random()*0.24;

    document.body.appendChild(note);
}

</script>

</body>
</html>
