<!DOCTYPE html>
<html lang="zh">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="
width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>歌曲详情</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link href="
https://fonts.googleapis.com/css2?
family=Cormorant+Garamond:wght@300;400;500&
family=Noto+Serif+SC:wght@300;400;500&
display=swap"
rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    overflow:hidden;

    width:100vw;
    height:100vh;

    background:
    radial-gradient(
    circle at center,
    rgba(236,230,255,0.7),
    rgba(250,245,248,1) 70%);

    font-family:
    'Cormorant Garamond',
    'Noto Serif SC',
    serif;

    animation:
    bgMove 10s ease-in-out infinite alternate;
}

@keyframes bgMove{

    from{
        filter:hue-rotate(0deg);
    }

    to{
        filter:hue-rotate(8deg);
    }
}

.container{

    width:92%;
    height:88vh;

    position:relative;

    margin:auto;
    margin-top:4vh;

    border-radius:42px;

    overflow:hidden;

    background:
    rgba(255,255,255,0.34);

    backdrop-filter:blur(12px);

    box-shadow:
    0 0 60px rgba(230,210,255,0.15) inset,
    0 0 40px rgba(255,255,255,0.4);
}

/* 返回 */

.back{

    position:absolute;

    top:34px;
    left:34px;

    text-decoration:none;

    color:#a5959e;

    font-size:20px;

    z-index:50;

    transition:0.3s;
}

.back:hover{

    opacity:0.7;
}

/* 正在播放 */

.song-title{

    position:absolute;

    top:70px;
    left:38px;

    font-size:28px;

    font-style:italic;

    font-weight:500;

    color:#9f8f99;

    letter-spacing:1px;

    z-index:999;

    text-shadow:
    0 0 18px rgba(255,255,255,0.45);
}

/* 音量 */

.volume-wrap{

    position:absolute;

    top:122px;
    left:42px;

    z-index:999;

    display:flex;

    align-items:center;

    gap:12px;

    opacity:0.85;
}

.volume-icon{

    color:#9f8f99;

    font-size:14px;
}

.volume-slider{

    width:160px;

    height:6px;

    appearance:none;

    border-radius:999px;

    outline:none;

    background:
    rgba(155,140,148,0.18);

    box-shadow:
    inset 0 0 6px rgba(110,100,108,0.14);
}

.volume-slider::-webkit-slider-runnable-track{

    height:6px;

    background:
    rgba(155,140,148,0.34);

    border-radius:999px;
}

.volume-slider::-webkit-slider-thumb{

    appearance:none;

    width:14px;
    height:14px;

    border-radius:50%;

    background:
    rgba(255,255,255,0.96);

    margin-top:-4px;

    box-shadow:
    0 0 10px rgba(255,255,255,0.65);
}

/* 中间 */

.center{

    position:absolute;

    left:50%;
    top:58%;

    transform:
    translate(-50%,-50%);

    display:flex;
    flex-direction:column;
    align-items:center;

    background:
    rgba(248,244,238,0.82);

    padding:
    36px 30px 26px 30px;

    border-radius:
    34px;

    backdrop-filter:
    blur(12px);

    box-shadow:
    0 0 30px rgba(255,255,255,0.45);
}

/* glow */

.glow{

    position:absolute;

    width:520px;
    height:520px;

    border-radius:50%;

    background:
    radial-gradient(
    circle,
    rgba(228,215,255,0.42),
    rgba(255,255,255,0));

    filter:blur(50px);

    animation:
    pulse 5s ease-in-out infinite alternate;
}

@keyframes pulse{

    from{

        transform:scale(0.9);
        opacity:0.5;
    }

    to{

        transform:scale(1.08);
        opacity:0.9;
    }
}

/* 黑胶 */

.record{

    width:360px;
    height:360px;

    border-radius:50%;

    border:
    1px solid rgba(230,225,215,0.9);

    position:relative;

    animation:
    spin 12s linear infinite;

    background:
    radial-gradient(circle,
    #111 0%,
    #111 12%,
    #f6f6f6 13%,
    #ececec 32%,
    #fafafa 52%,
    #efefef 74%,
    #ffffff 100%);

    box-shadow:
    0 0 60px rgba(255,255,255,0.8),
    0 0 40px rgba(220,220,255,0.5);
}

.record::before{

    content:"";

    position:absolute;

    inset:18px;

    border-radius:50%;

    border:
    1px solid rgba(255,255,255,0.45);
}

.record::after{

    content:"";

    position:absolute;

    top:50%;
    left:50%;

    transform:
    translate(-50%,-50%);

    width:26px;
    height:26px;

    border-radius:50%;

    background:#111;
}

@keyframes spin{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}

/* 播放器 */

.player-row{

    margin-top:32px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:12px;
}

#player{

    width:250px;

    opacity:0.78;
}

.like-btn{

    display:flex;

    align-items:center;

    gap:5px;
}



#heartBtn{

    font-size:28px;

    color:#c7b6be;

    cursor:pointer;

    transition:0.25s;
}

#heartBtn:hover{

    transform:scale(1.08);
}

#heartBtn.liked{

    color:#ff6b81;
}

#likeCount{

    font-size:16px;

    color:#9f8d95;
}

/* 音符 */

.note{

    position:absolute;

    color:#eadfff;

    pointer-events:none;

    animation:
    depthMove linear infinite;
}

@keyframes depthMove{

    0%{

        transform:
        translateZ(-500px)
        scale(0.3);

        opacity:0;
    }

    20%{
        opacity:0.24;
    }

    100%{

        transform:
        translateZ(300px)
        scale(1.8);

        opacity:0;
    }
}

/* 手机 */

@media (max-width:768px){

.container{

    width:94%;
    height:92vh;

    margin-top:2vh;

    border-radius:28px;
}

.back{

    top:24px;
    left:22px;

    font-size:18px;
}

.song-title{

    top:56px;
    left:24px;

    font-size:21px;
}

.volume-wrap{

    top:96px;
    left:24px;

    gap:10px;
}

.volume-slider{

    width:120px;

    height:4px;

    background:
    rgba(255,255,255,0.14);
}

.volume-slider::-webkit-slider-runnable-track{

    height:4px;

    background:
    rgba(255,255,255,0.22);
}

.volume-slider::-webkit-slider-thumb{

    width:11px;
    height:11px;

    margin-top:-3.5px;
}

.volume-icon{

    font-size:12px;

    color:#d8ccd4;
}

.center{

    top:57%;
}

.glow{

    width:300px;
    height:300px;
}

.record{

    width:220px;
    height:220px;
}

.record::before{

    inset:12px;
}

.record::after{

    width:18px;
    height:18px;
}

#player{

    width:220px;

    margin-top:20px;
}

}

</style>
</head>

<body>

<div class="container">

<a
href="index.html?entered=true&resume=true"
class="back"

onclick="
localStorage.setItem('bgmPlaying','true');
"
>

← 返回歌单

</a>

<div class="song-title"
id="songTitle">

歌曲

</div>

<div class="volume-wrap">

<span class="volume-icon">
♫
</span>

<input
type="range"
min="0"
max="100"
value="45"
class="volume-slider"
id="volumeSlider">

</div>

<div class="center">

<div class="glow"></div>

<div class="record"></div>

<div class="player-row">

    <audio controls id="player">
    </audio>

    <div class="like-btn">

        <span id="heartBtn">
        ♡
        </span>

        <span id="likeCount">
        0
        </span>

    </div>

</div>

</div>

</div>

<script type="module">

import { createClient }
from
'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

const supabase =
createClient(

"https://bfprkzuculvqajekshfs.supabase.co",

'sb_publishable_RwapQC6PL9Dg54GWxd7lYQ_eJGOETc4'

);

const params =
new URLSearchParams(
window.location.search
);

const song =
params.get("song") || "歌曲";

document
.getElementById("songTitle")
.innerText =
"正在播放：《" + song + "》";

const player =
document.getElementById("player");

const audioPath =
"audioSource/" + song + ".mp3";

player.innerHTML =

'<source src="' +
audioPath +
'" type="audio/mpeg">';

player.load();


const symbols =
["♫","♪","♬","♩"];

for(let i=0;i<26;i++){

const note =
document.createElement("div");

note.className="note";

note.innerHTML =
symbols[
Math.floor(
Math.random()*symbols.length
)];

note.style.left =
Math.random()*100 + "vw";

note.style.top =
Math.random()*100 + "vh";

note.style.fontSize =
(18+Math.random()*60) + "px";

note.style.animationDuration =
(4+Math.random()*6) + "s";

note.style.animationDelay =
(-Math.random()*10) + "s";

note.style.opacity =
Math.random()*0.24;

document.body.appendChild(note);
}

const volumeSlider =
document.getElementById("volumeSlider");

volumeSlider.addEventListener(

"input",

()=>{

player.volume =
volumeSlider.value / 100;
}
);

player.volume = 0.45;

const heartBtn =
document.getElementById("heartBtn");

const likeCount =
document.getElementById("likeCount");

const localKey =
"liked_" + song;



async function loadLikes(){

    const { data } =
    await supabase
    .from("songs")
    .select("likes")
    .eq("name", song)
    .single();

    if(data){

        likeCount.innerHTML =
        data.likes || 0;
    }

    if(localStorage.getItem(localKey)){

        heartBtn.classList.add("liked");

        heartBtn.innerHTML = "♥";
    }
}



heartBtn.onclick = async()=>{

    const liked =
    localStorage.getItem(localKey);

    const { data } =
    await supabase
    .from("songs")
    .select("likes")
    .eq("name", song)
    .single();

    let currentLikes =
    data.likes || 0;

    if(!liked){

        currentLikes++;

        await supabase
        .from("songs")
        .update({
            likes: currentLikes
        })
        .eq("name", song);

        localStorage.setItem(
        localKey,
        "yes"
        );

        heartBtn.classList.add("liked");

        heartBtn.innerHTML = "♥";

    }else{

        currentLikes--;

        if(currentLikes < 0){

            currentLikes = 0;
        }

        await supabase
        .from("songs")
        .update({
            likes: currentLikes
        })
        .eq("name", song);

        localStorage.removeItem(localKey);

        heartBtn.classList.remove("liked");

        heartBtn.innerHTML = "♡";
    }

    likeCount.innerHTML =
    currentLikes;
}


loadLikes();

</script>

</body>
</html>
