<!DOCTYPE html>
<html lang="zh">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>歌曲详情</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{

    width:100%;
    height:100%;

    overflow:hidden;

    font-family:
    "Times New Roman",
    "STSong",
    serif;
}

/* 背景 */

body{

    background:
    radial-gradient(circle at center,
    #f8edf4 0%,
    #f6f1f7 30%,
    #f1f3fa 70%,
    #edf3ff 100%);

    position:relative;
}

/* 外框 */

.container{

    position:absolute;

    inset:22px;

    border-radius:42px;

    border:1px solid rgba(255,255,255,0.5);

    box-shadow:
    inset 0 0 100px rgba(255,255,255,0.3);

    overflow:hidden;
}

/* 柔光 */

.glow{

    position:absolute;

    width:700px;
    height:700px;

    border-radius:50%;

    left:50%;
    top:72%;

    transform:translate(-50%,-50%);

    background:
    radial-gradient(circle,
    rgba(232,223,255,0.34),
    transparent 70%);
}

/* 返回 */

.back{

    position:absolute;

    top:46px;
    left:56px;

    text-decoration:none;

    color:#8f7f86;

    font-size:24px;

    font-style:italic;

    z-index:20;
}

/* 歌名 */

.song-title{

    position:absolute;

    top:110px;
    left:50%;

    transform:translateX(-50%);

    font-size:76px;

    color:#9d8a93;

    font-style:italic;

    font-weight:500;

    white-space:nowrap;

    z-index:20;
}

/* 中间区域 */

.center-box{

    position:absolute;

    left:50%;
    top:54%;

    transform:translate(-50%,-50%);

    display:flex;

    flex-direction:column;

    align-items:center;
}

/* 唱片 */

.vinyl{

    width:380px;
    height:380px;

    border-radius:50%;

    background:

    radial-gradient(
    circle,
    #111 0%,
    #111 10%,
    #f6f6f6 11%,
    #eaeaea 24%,
    #fafafa 38%,
    #e3e3e3 52%,
    #f8f8f8 66%,
    #ececec 82%,
    #ffffff 100%
    );

    box-shadow:
    0 18px 40px rgba(0,0,0,0.08);

    animation:
    spin 8s linear infinite;
}

/* 转动 */

@keyframes spin{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}

/* 播放器 */

audio{

    margin-top:42px;

    width:360px;

    opacity:0.8;
}

</style>
</head>

<body>

<div class="container">

    <div class="glow"></div>

    <a href="index.html" class="back">
        ← 返回歌单
    </a>

    <div class="song-title" id="songTitle">
        歌曲
    </div>

    <div class="center-box">

        <div class="vinyl"></div>

        <audio controls>
            <source src="">
        </audio>

    </div>

</div>

<script>

const params =
new URLSearchParams(window.location.search);

const song =
params.get("song");

document.getElementById("songTitle")
.innerText = song || "歌曲";

</script>

</body>
</html>
