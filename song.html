<!DOCTYPE html>
<html lang="zh">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>歌曲详情</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:#f7f3f2;

    height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    overflow:hidden;

    font-family:
    "Times New Roman",
    "STSong",
    serif;
}

/* 背景 */

body::before{

    content:"";

    position:fixed;

    inset:18px;

    border-radius:36px;

    background:

    radial-gradient(
    circle at top left,
    rgba(255,233,241,0.9),
    transparent 28%
    ),

    radial-gradient(
    circle at bottom center,
    rgba(232,228,255,0.75),
    transparent 35%
    ),

    #f7f2f2;

    border:2px solid rgba(255,255,255,0.5);

    z-index:-1;
}

.container{

    width:1300px;

    height:760px;

    border-radius:40px;

    background:rgba(255,255,255,0.28);

    backdrop-filter:blur(12px);

    padding:50px;

    position:relative;
}

/* 返回 */

.back{

    font-size:28px;

    color:#8f7e82;

    cursor:pointer;

    text-decoration:none;

    font-style:italic;
}

/* 歌名 */

.song-title{

    margin-top:28px;

    font-size:72px;

    color:#8f7e82;

    font-style:italic;
}

/* 内容 */

.content{

    margin-top:40px;

    display:flex;

    justify-content:space-between;

    align-items:center;
}

/* 左图 */

.cover{

    width:470px;
    height:470px;

    border-radius:28px;

    object-fit:cover;

    box-shadow:
    0 12px 40px rgba(0,0,0,0.08);
}

/* 右边 */

.right{

    display:flex;

    flex-direction:column;

    align-items:center;
}

/* 黑胶 */

.record{

    width:350px;
    height:350px;

    border-radius:50%;

    background:

    radial-gradient(
    circle,
    #111 0%,
    #111 14%,
    #ddd 15%,
    #eee 24%,
    #ddd 26%,
    #f8f8f8 40%,
    #ddd 55%,
    #f8f8f8 70%,
    #ddd 100%
    );

    animation:
    spin 12s linear infinite;

    box-shadow:
    0 10px 30px rgba(0,0,0,0.1);
}

@keyframes spin{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}

/* 音频 */

audio{

    margin-top:40px;

    width:360px;

    opacity:0.75;
}

</style>
</head>

<body>

<div class="container">

<a href="index.html" class="back">
← 返回歌单
</a>

<div class="song-title" id="songTitle">
歌曲
</div>

<div class="content">

<img
class="cover"
src="https://images.unsplash.com/photo-1511379938547-c1f69419868d?q=80&w=1200&auto=format&fit=crop">

<div class="right">

<div class="record"></div>

<audio controls>
<source src="">
</audio>

</div>

</div>

</div>

<script>

/* 获取歌名 */

const params =
new URLSearchParams(window.location.search);

const song =
params.get("song");

/* 显示歌名 */

document.getElementById("songTitle")
.innerText = song || "歌曲";

</script>

</body>
</html>
