<!DOCTYPE html>
<html lang="zh">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>歌曲详情</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:#f7f3f2;

    font-family:
    "Times New Roman",
    "STSong",
    serif;

    overflow:hidden;
}

/* 背景 */

body::before{

    content:"";

    position:fixed;

    inset:18px;

    border-radius:38px;

    background:

    radial-gradient(
    circle at top left,
    rgba(255,233,241,0.9),
    transparent 28%
    ),

    radial-gradient(
    circle at bottom center,
    rgba(232,228,255,0.78),
    transparent 35%
    ),

    #f7f2f2;

    border:2px solid rgba(255,255,255,0.55);

    z-index:-1;

    box-shadow:
    inset 0 0 120px rgba(255,255,255,0.45);
}

/* 整体 */

.container{

    width:86vw;
    height:78vh;

    margin:auto;

    margin-top:9vh;

    border-radius:40px;

    background:
    rgba(255,255,255,0.18);

    backdrop-filter:blur(18px);

    padding:48px 52px;

    position:relative;
}

/* 返回 */

.back{

    text-decoration:none;

    color:#8f7e82;

    font-size:26px;

    font-style:italic;
}

/* 歌名 */

.song-title{

    margin-top:26px;

    font-size:78px;

    color:#9c8b92;

    font-style:italic;

    font-weight:500;
}

/* 内容 */
/* 这里改了 gap */

.content{

    margin-top:34px;

    display:flex;

    justify-content:center;

    align-items:center;

    gap:90px;
}

/* 左边图片 */

.cover{

    width:480px;
    height:480px;

    object-fit:cover;

    border-radius:34px;

    box-shadow:
    0 12px 30px rgba(0,0,0,0.08);
}

/* 右边 */

.right{

    display:flex;

    flex-direction:column;

    align-items:center;
}

/* 唱片 */

.vinyl{

    width:340px;
    height:340px;

    border-radius:50%;

    background:

    radial-gradient(
    circle,
    #111 0%,
    #111 14%,
    #f4f4f4 15%,
    #e7e7e7 28%,
    #f8f8f8 42%,
    #dfdfdf 58%,
    #f6f6f6 72%,
    #ececec 86%,
    #fafafa 100%
    );

    box-shadow:
    0 12px 35px rgba(0,0,0,0.08);

    animation:
    rotate 10s linear infinite;
}

@keyframes rotate{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}

/* 音频 */

audio{

    margin-top:34px;

    width:340px;

    opacity:0.8;
}

</style>
</head>

<body>

<div class="container">

    <a href="index.html" class="back">
        ← 返回歌单
    </a>

    <div class="song-title" id="songTitle">
        歌曲名
    </div>

    <div class="content">

        <!-- 左边图片 -->

        <img
        src="https://images.unsplash.com/photo-1511379938547-c1f69419868d?q=80&w=1200&auto=format&fit=crop"
        class="cover">

        <!-- 右边 -->

        <div class="right">

            <div class="vinyl"></div>

            <audio controls>
                <source src="">
            </audio>

        </div>

    </div>

</div>

<script>

const params =
new URLSearchParams(window.location.search);

const song =
params.get("song");

document.getElementById("songTitle")
.innerText = song || "歌曲";

</script>

</body>
</html>
