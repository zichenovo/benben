<!DOCTYPE html>

<html lang="zh">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>从垃到夯大排名</title>

<style>

body{

    margin:0;

    background:#f7f2f2;

    font-family:
    "Times New Roman",
    "STSong",
    serif;

    color:#9e8892;
}

/* title */

.title{

    text-align:center;

    margin-top:90px;

    font-size:48px;

    font-style:italic;
}

/* songs */

.rank-wrap{

    width:86%;

    margin:auto;

    margin-top:60px;
}

.song-card{

    background:
    rgba(255,255,255,0.5);

    backdrop-filter:blur(10px);

    border-radius:26px;

    padding:28px;

    margin-bottom:24px;

    font-size:28px;

    transition:0.3s;
}

.song-card:hover{

    transform:translateY(-4px);

    background:
    rgba(255,255,255,0.72);
}

</style>

</head>

<body>

<div class="title">

从垃到夯大排名

</div>

<div class="rank-wrap">

<div class="song-card">
1. 梁山伯与茱丽叶
</div>

<div class="song-card">
2. 水星记
</div>

<div class="song-card">
3. 夏天的风
</div>

<div class="song-card">
4. 晴天
</div>

</div>

</body>

</html>
