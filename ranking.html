<script type="module">

import { createClient }

from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

/* supabase */

const supabaseUrl =
"https://bfprkzuculvqajekshfs.supabase.co";

const supabaseKey =
"sb_publishable_RwapQC6PL9Dg54GWxd7lYQ_eJGOETc4";

const supabase =
createClient(
supabaseUrl,
supabaseKey
);

/* songs */

const songs = [

"野火一季","走马","失眠了","空空","半壶纱",

"要爱我","天赋","小公主","after17",

"末日","心愿便利贴","梁山伯与茱丽叶",

"AlwaysOnline","你的crush降临了吗",

"绿色","爱我你就抱抱我","那时雨",

"东京不太热","一滴泪的时间",

"夏天的风","怪我咯","虚拟","宠坏",

"不要忘记我爱你","树的花语",

"奇妙能力歌","左手右手",

"天龙八部之宿敌","南泥湾",

"越来越不懂","公主殿下","宝贝",

"有雨有雨","粉雾海","宠爱",

"红昭愿","Doll","日不落","怎么了",

"我们","红色高跟鞋","关键词",

"怪物","第57次取消发送",

"凑热闹","嗯哼","不怕",

"如果爱忘了","摆","来不及",

"几分之几","take me hand"

];

const rankWrap =
document.getElementById("rankWrap");

/* 当前播放 */

let currentPlayingSong = null;

/* render */

async function renderSongs(){

    rankWrap.innerHTML = "";

    let songData = [];

    /* 读取数据库 */

    let { data,error } =
    await supabase
    .from("songs")
    .select("*");

    /* 防炸 */

    if(error){

        console.log(error);

        data = [];
    }

    /* 转换格式 */

    data.forEach(docu=>{

        songData.push({

            name:docu.name,

            likes:docu.likes || 0

        });

    });

    /* 新歌自动加入 */

    for(let song of songs){

        const exists =
        songData.find(
        s=>s.name===song
        );

        if(!exists){

            await supabase
            .from("songs")
            .insert([

                {

                    name:song,

                    likes:0

                }

            ]);

            songData.push({

                name:song,

                likes:0

            });
        }
    }

    /* 排序 */

    songData.sort(
    (a,b)=>
    b.likes - a.likes
    );

    /* create */

    songData.forEach((song,index)=>{

        const card =
        document.createElement("div");

        card.className =
        "song-card";

        card.innerHTML = `

        <div>
        ${index + 1}. ${song.name}
        </div>

        <div class="right">

            <div
            class="play-btn"
            data-song="${song.name}">
            ▷
            </div>

            <div class="like-count">
            ${song.likes}
            </div>

            <div class="heart">
            ♡
            </div>

        </div>

        `;

        const heart =
        card.querySelector(".heart");

        const playBtn =
        card.querySelector(".play-btn");

        const likeCount =
        card.querySelector(".like-count");

        /* 已点赞 */

        let likedSongs =
        JSON.parse(

            localStorage.getItem(
            "likedSongs"
            ) || "[]"

        );

        /* 恢复状态 */

        if(
        likedSongs.includes(song.name)
        ){

            heart.innerHTML = "♥";

            heart.style.color =
            "#ff8ea1";
        }

        /* 点赞 */

        heart.onclick =
        async ()=>{

            /* 已点赞 */

            if(
            likedSongs.includes(song.name)
            ){

                heart.innerHTML = "♡";

                heart.style.color =
                "#cbb7b2";

                let newLikes =
                parseInt(
                likeCount.innerHTML
                ) - 1;

                likeCount.innerHTML =
                newLikes;

                likedSongs =
                likedSongs.filter(
                item =>
                item !== song.name
                );

                localStorage.setItem(

                    "likedSongs",

                    JSON.stringify(
                    likedSongs
                    )

                );

                await supabase
                .from("songs")
                .update({

                    likes:newLikes

                })
                .eq(
                "name",
                song.name
                );

                renderSongs();
            }

            /* 没点赞 */

            else{

                heart.innerHTML = "♥";

                heart.style.color =
                "#ff8ea1";

                let newLikes =
                parseInt(
                likeCount.innerHTML
                ) + 1;

                likeCount.innerHTML =
                newLikes;

                likedSongs.push(song.name);

                localStorage.setItem(

                    "likedSongs",

                    JSON.stringify(
                    likedSongs
                    )

                );

                await supabase
                .from("songs")
                .update({

                    likes:newLikes

                })
                .eq(
                "name",
                song.name
                );

                renderSongs();
            }

        };

        /* 播放 */

        playBtn.onclick = ()=>{

            const currentSong =
            playBtn.getAttribute(
            "data-song"
            );

            const player =
            document.getElementById(
            "songPlayer"
            );

            const bgm =
            document.getElementById(
            "bgm"
            );

            /* 当前正在播放 */

            if(

            currentPlayingSong === currentSong

            &&

            !player.paused

            ){

                player.pause();

                currentPlayingSong =
                null;

                playBtn.innerHTML =
                "▷";

                if(bgm){

                    bgm.volume = 1;
                }

                return;
            }

            /* 全部恢复 */

            document
            .querySelectorAll(
            ".play-btn"
            )
            .forEach(btn=>{

                btn.innerHTML =
                "▷";

            });

            /* bgm变小 */

            if(bgm){

                bgm.volume = 0;
            }

            currentPlayingSong =
            currentSong;

            player.src =

            "audioSource/" +

            currentSong +

            ".mp3";

            player.play();

            playBtn.innerHTML =
            "❚❚";

            player.onended = ()=>{

                currentPlayingSong =
                null;

                playBtn.innerHTML =
                "▷";

                if(bgm){

                    bgm.volume = 1;
                }
            };
        };

        rankWrap.appendChild(card);

    });

}

renderSongs();

</script>
