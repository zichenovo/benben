<script type="module">

import {

initializeApp

}

from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getFirestore,
collection,
getDocs,
doc,
setDoc,
updateDoc,
increment

}

from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* firebase */

const firebaseConfig = {

  apiKey: "AIzaSyAEEIghOT8YW27nKQoXRarVfW6CGclmixw",

  authDomain: "benben-ranking.firebaseapp.com",

  projectId: "benben-ranking",

  storageBucket: "benben-ranking.firebasestorage.app",

  messagingSenderId: "1074565504122",

  appId: "1:1074565504122:web:37e84bb299b2fdf360afc3",

  measurementId: "G-LGLWQTYSP6"
};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

/* songs */

const songs = [

"野火一季","走马","失眠了","空空","半壶纱",

"要爱我","天赋","小公主","after17",

"末日","心愿便利贴","梁山伯与茱丽叶",

"AlwaysOnline","你的crush降临了吗",

"绿色","爱我你就抱抱我","那时雨",

"东京不太热","一滴泪的时间",

"夏天的风","怪我咯","虚拟","宠坏",

"不要忘记我爱你","树的花语",

"奇妙能力歌","左手右手",

"天龙八部之宿敌","南泥湾",

"越来越不懂","公主殿下","宝贝",

"有雨有雨","粉雾海","宠爱",

"红昭愿","Doll","日不落","怎么了",

"我们","红色高跟鞋","关键词",

"怪物","第57次取消发送",

"凑热闹","嗯哼","不怕",

"如果爱忘了","摆","来不及",

"几分之几","take me hand"

];

const rankWrap =
document.getElementById("rankWrap");

const player =
document.getElementById("songPlayer");

const bgm =
document.getElementById("bgm");

let currentPlayingSong = null;

/* render */

async function renderSongs(){

    rankWrap.innerHTML = "";

    let songData = [];

    try{

        const snapshot =
        await getDocs(
            collection(db,"songs")
        );

        snapshot.forEach(docu=>{

            songData.push({

                name:docu.id,

                likes:
                docu.data().likes || 0

            });

        });

    }catch(error){

        console.log(
        "Firebase 连不上",
        error
        );

        songData =
        songs.map(song=>({

            name:song,
            likes:0

        }));
    }

    /* 新歌自动加入 */

    for(let song of songs){

        const exists =
        songData.find(
        s=>s.name===song
        );

        if(!exists){

            try{

                await setDoc(

                    doc(db,"songs",song),

                    {likes:0}

                );

            }catch(error){}

            songData.push({

                name:song,
                likes:0

            });
        }
    }

    /* 排序 */

    songData.sort(
    (a,b)=>
    b.likes - a.likes
    );

    /* create */

    songData.forEach((song,index)=>{

        const card =
        document.createElement("div");

        card.className =
        "song-card";

        card.innerHTML = `

        <div>
        ${index + 1}. ${song.name}
        </div>

        <div class="right">

            <div
            class="play-btn"
            data-song="${song.name}">
            ▷
            </div>

            <div class="like-count">
            ${song.likes}
            </div>

            <div class="heart">
            ♡
            </div>

        </div>

        `;

        const heart =
        card.querySelector(".heart");

        const playBtn =
        card.querySelector(".play-btn");

        const likeCount =
        card.querySelector(".like-count");

        /* 已点赞 */

        let likedSongs =
        JSON.parse(

            localStorage.getItem(
            "likedSongs"
            ) || "[]"

        );

        if(
        likedSongs.includes(song.name)
        ){

            heart.innerHTML = "♥";

            heart.style.color =
            "#ff8ea1";
        }

        /* 点赞 */

        heart.onclick =
        async ()=>{

            const ref =
            doc(db,"songs",song.name);

            /* 取消 */

            if(
            likedSongs.includes(song.name)
            ){

                heart.innerHTML = "♡";

                heart.style.color =
                "#cbb7b2";

                likeCount.innerHTML =

                parseInt(
                likeCount.innerHTML
                ) - 1;

                likedSongs =

                likedSongs.filter(
                item =>
                item !== song.name
                );

                localStorage.setItem(

                    "likedSongs",

                    JSON.stringify(
                    likedSongs
                    )

                );

                try{

                    await updateDoc(

                        ref,

                        {

                            likes:
                            increment(-1)

                        }

                    );

                }catch(error){}

            }

            /* 点赞 */

            else{

                heart.innerHTML = "♥";

                heart.style.color =
                "#ff8ea1";

                likeCount.innerHTML =

                parseInt(
                likeCount.innerHTML
                ) + 1;

                likedSongs.push(song.name);

                localStorage.setItem(

                    "likedSongs",

                    JSON.stringify(
                    likedSongs
                    )

                );

                try{

                    await updateDoc(

                        ref,

                        {

                            likes:
                            increment(1)

                        }

                    );

                }catch(error){}

            }

            renderSongs();
        };

        /* 播放 */

        playBtn.onclick = ()=>{

            const currentSong =

            playBtn.getAttribute(
            "data-song"
            );

            /* 当前正在播放 */

            if(

                currentPlayingSong
                === currentSong

                &&

                !player.paused

            ){

                player.pause();

                currentPlayingSong =
                null;

                playBtn.innerHTML =
                "▷";

                if(bgm){

                    bgm.play();
                }

                return;
            }

            /* 所有按钮恢复 */

            document
            .querySelectorAll(
            ".play-btn"
            )
            .forEach(btn=>{

                btn.innerHTML =
                "▷";

            });

            /* 暂停bgm */

            if(bgm){

                bgm.pause();
            }

            currentPlayingSong =
            currentSong;

            player.src =

            "audioSource/" +
            currentSong +
            ".mp3";

            player.play();

            playBtn.innerHTML =
            "❚❚";

            /* 结束 */

            player.onended = ()=>{

                currentPlayingSong =
                null;

                playBtn.innerHTML =
                "▷";

                if(bgm){

                    bgm.play();
                }
            };
        };

        rankWrap.appendChild(card);

    });

}

renderSongs();

</script>
