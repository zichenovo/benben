<!DOCTYPE html>

<html lang="zh">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>从夯到拉大排名</title>

<style>

body{

    margin:0;

    background:
    linear-gradient(
    to bottom right,
    #f8f2f3,
    #f5efef,
    #f6f1f7
    );

    font-family:
    "Times New Roman",
    "STSong",
    serif;

    overflow-x:hidden;
}

/* back */

.back-btn{

    position:fixed;

    top:38px;

    left:42px;

    color:#a8929b;

    font-size:18px;

    font-style:italic;

    cursor:pointer;

    z-index:999;

    transition:0.3s;

    text-decoration:none;
}

.back-btn:hover{

    transform:translateX(-4px);

    color:#8f7982;
}

/* title */

.title{

    text-align:center;

    margin-top:70px;

    font-size:38px;

    font-style:italic;

    color:#aa8f98;
}

/* list */

.rank-wrap{

    width:520px;

    max-width:88%;

    margin:auto;

    margin-top:42px;

    margin-bottom:80px;
}

/* card */

.song-card{

    width:100%;

    height:56px;

    background:
    rgba(255,255,255,0.45);

    backdrop-filter:blur(12px);

    border-radius:22px;

    padding-left:22px;

    padding-right:22px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:12px;

    font-size:17px;

    color:#a58d97;

    box-sizing:border-box;

    transition:0.3s;
}

.song-card:hover{

    transform:translateY(-3px);

    background:
    rgba(255,255,255,0.72);
}

/* right */

.right{

    display:flex;

    align-items:center;

    gap:10px;
}

/* likes */

.like-count{

    color:#c7b9bf;

    font-size:16px;
}

/* heart */

.heart{

    cursor:pointer;

    font-size:18px;

    color:#cbb7b2;

    transition:0.25s;

    user-select:none;
}

.heart:hover{

    transform:scale(1.15);
}

/* mobile */

@media(max-width:768px){

    .back-btn{

        top:24px;

        left:20px;

        font-size:15px;
    }

    .title{

        font-size:32px;

        margin-top:68px;
    }

    .rank-wrap{

        width:90%;

        margin-top:36px;
    }

    .song-card{

        height:58px;

        font-size:17px;

        border-radius:22px;

        padding-left:20px;

        padding-right:20px;
    }
}

.refresh-text{

    text-align:center;

    margin-top:12px;

    font-size:13px;

    color:#c6b8be;

    letter-spacing:1px;

    font-style:italic;
}

</style>

</head>

<body>

<a
href="index.html?entered=true"
class="back-btn">

← 返回歌单

</a>

<div class="title">

从夯到垃大排名

</div>

<div class="refresh-text">

（每10分钟刷新一次，也可以手动刷新哟）

</div>

<div
class="rank-wrap"
id="rankWrap">

</div>

<script type="module">

import {

initializeApp

}

from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getFirestore,
collection,
getDocs,
doc,
setDoc,
updateDoc,
increment

}

from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* firebase */

const firebaseConfig = {

  apiKey: "AIzaSyAEEIghOT8YW27nKQoXRarVfW6CGclmixw",

  authDomain: "benben-ranking.firebaseapp.com",

  projectId: "benben-ranking",

  storageBucket: "benben-ranking.firebasestorage.app",

  messagingSenderId: "1074565504122",

  appId: "1:1074565504122:web:37e84bb299b2fdf360afc3",

  measurementId: "G-LGLWQTYSP6"
};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

/* songs */

const songs = [

"野火一季","走马","失眠了","空空","半壶纱",

"要爱我","天赋","小公主","after17",

"末日","心愿便利贴","梁山伯与茱丽叶",

"AlwaysOnline","你的crush降临了吗",

"绿色","爱我你就抱抱我","那时雨",

"东京不太热","一滴泪的时间",

"夏天的风","怪我咯","虚拟","宠坏",

"不要忘记我爱你","树的花语",

"奇妙能力歌","左手右手",

"天龙八部之宿敌","南泥湾",

"越来越不懂","公主殿下","宝贝",

"有雨有雨","粉雾海","宠爱",

"红昭愿","Doll","日不落","怎么了",

"我们","红色高跟鞋","关键词",

"怪物","第57次取消发送",

"凑热闹","嗯哼","不怕",

"如果爱忘了","摆","来不及",

"几分之几","take me hand"

];

const rankWrap =
document.getElementById("rankWrap");

/* render */

async function renderSongs(){

    rankWrap.innerHTML = "";

    let songData = [];

    /* 一次性读取全部 */

    const snapshot =
    await getDocs(
        collection(db,"songs")
    );

    snapshot.forEach(docu=>{

        songData.push({

            name:docu.id,

            likes:docu.data().likes || 0

        });

    });

    /* 新歌自动加入 */

    for(let song of songs){

        const exists =
        songData.find(
        s=>s.name===song
        );

        if(!exists){

            await setDoc(

                doc(db,"songs",song),

                {likes:0}

            );

            songData.push({

                name:song,
                likes:0

            });
        }
    }

    /* sort */

    songData.sort(
    (a,b)=>
    b.likes - a.likes
    );

    /* create */

    songData.forEach((song,index)=>{

        const card =
        document.createElement("div");

        card.className =
        "song-card";

        card.innerHTML = `

        <div>
        ${index + 1}. ${song.name}
        </div>

        <div class="right">

            <div class="like-count">
            ${song.likes}
            </div>

            <div class="heart">
            ♡
            </div>

        </div>

        `;

        const heart =
        card.querySelector(".heart");

        const likeCount =
        card.querySelector(".like-count");

        /* 已点赞列表 */

        let likedSongs =
        JSON.parse(
            localStorage.getItem(
                "likedSongs"
            ) || "[]"
        );

        /* 如果点过 */

        if(
        likedSongs.includes(song.name)
        ){

            heart.innerHTML = "♥";

            heart.style.color =
            "#ff8ea1";
        }

        /* 点击 */

        heart.onclick =
        async ()=>{

            const ref =
            doc(db,"songs",song.name);

            /* 已点赞 → 取消 */

            if(
            likedSongs.includes(song.name)
            ){

                heart.innerHTML = "♡";

                heart.style.color =
                "#cbb7b2";

                likeCount.innerHTML =
                parseInt(
                likeCount.innerHTML
                ) - 1;

                likedSongs =
                
                likedSongs.filter(
                    item => item !== song.name
                );
                
                localStorage.setItem(
                    
                "likedSongs",
                JSON.stringify(
                    
                likedSongs
            )
        );

                await updateDoc(

                    ref,

                    {

                        likes:
                        increment(-1)

                    }

                );

            }

            /* 没点赞 → 点赞 */

            else{

                heart.innerHTML = "♥";

                heart.style.color =
                "#ff8ea1";

                likeCount.innerHTML =
                parseInt(
                likeCount.innerHTML
                ) + 1;

                likedSongs.push(song.name);

                localStorage.setItem(

                    "likedSongs",

                    JSON.stringify(
                    likedSongs
                    )

                );

                await updateDoc(

                    ref,

                    {

                        likes:
                        increment(1)

                    }

                );

            }




        };

        rankWrap.appendChild(card);

    });

}

setInterval(renderSongs, 600000);

renderSongs();

</script>

</body>

</html>
