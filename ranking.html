<!DOCTYPE html>
<html lang="zh">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
从夯到拉大排名
</title>

<style>

body{

    margin:0;

    background:
    linear-gradient(
    to bottom right,
    #f8f2f3,
    #f5efef,
    #f6f1f7
    );

    font-family:
    "Times New Roman",
    "STSong",
    serif;
}

/* 返回 */

.back-btn{

    position:fixed;

    top:36px;
    left:38px;

    color:#b8a2ab;

    font-size:20px;

    font-style:italic;

    cursor:pointer;

    z-index:999;
}

/* 标题 */

.title{

    text-align:center;

    margin-top:90px;

    font-size:58px;

    color:#b8a2ab;

    font-style:italic;

    font-weight:300;
}

.subtitle{

    text-align:center;

    color:#d0c0c0;

    margin-top:8px;

    font-size:16px;

    font-style:italic;
}

/* 歌单 */

#rankWrap{

    width:78%;

    max-width:560px;

    margin:

    40px auto
    80px auto;
}

.song-card{

    background:
    rgba(255,255,255,0.45);

    border-radius:16px;

    padding:

    12px 18px;

    margin-bottom:18px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    color:#a7939d;

    font-size:17px;

    backdrop-filter:blur(8px);
}

.right{

    display:flex;

    align-items:center;

    gap:18px;
}

/* 播放 */

.play-btn{

    cursor:pointer;

    font-size:18px;

    color:#b59ca6;

    user-select:none;
}

/* 心 */

.heart{

    cursor:pointer;

    font-size:25px;

    color:#ccb7bf;

    user-select:none;
}

.like-count{

    width:16px;

    text-align:center;
}

/* 手机 */

@media(max-width:768px){

    .title{

        font-size:50px;

        margin-top:120px;
    }

    .song-card{

        font-size:17px;

        padding:
        20px 22px;
    }

    .play-btn{

        font-size:17px;
    }

    .heart{

        font-size:23px;
    }

    .back-btn{

        top:20px;
        left:20px;

        font-size:16px;
    }
}

</style>

</head>

<body>

<div
class="back-btn"

onclick="
window.location.href='song.html'
"
>

← 返回歌单

</div>

<div class="title">

从夯到拉大排名

</div>


<div id="rankWrap"></div>

<audio
id="songPlayer">
</audio>

<audio
id="bgm"
src="bgm.mp3"
loop
style="display:none">
</audio>

<script type="module">

import { createClient }

from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

/* supabase */

const supabaseUrl =
"https://bfprkzuculvqajekshfs.supabase.co";

const supabaseKey =
"sb_publishable_RwapQC6PL9Dg54GWxd7lYQ_eJGOETc4";

const supabase =
createClient(
supabaseUrl,
supabaseKey
);

/* songs */

const songs = [

"末日","走马","天赋","空空","半壶纱",
"要爱我","失眠了","小公主","after17",
"野火一季","心愿便利贴","梁山伯与茱丽叶",
"AlwaysOnline","你的crush降临了吗",
"绿色","爱我你就抱抱我","那时雨",
"东京不太热","一滴泪的时间",
"夏天的风","怪我咯","虚拟","宠坏",
"不要忘记我爱你","树的花语",
"奇妙能力歌","左手右手",
"天龙八部之宿敌","南泥湾",
"越来越不懂","公主殿下","宝贝",
"有雨有雨","粉雾海","宠爱",
"红昭愿","Doll","日不落","怎么了",
"我们","红色高跟鞋","关键词",
"怪物","第57次取消发送",
"凑热闹","嗯哼","不怕",
"如果爱忘了","摆","来不及",
"几分之几","take me hand"

];

const rankWrap =
document.getElementById(
"rankWrap"
);

const player =
document.getElementById(
"songPlayer"
);

const bgm =
document.getElementById(
"bgm"
);

/* bgm恢复 */

const savedTime =
localStorage.getItem(
"bgmTime"
);

if(savedTime){

    bgm.currentTime =
    parseFloat(savedTime);
}

bgm.volume = 1;

bgm.play().catch(()=>{});

setInterval(()=>{

    localStorage.setItem(

        "bgmTime",

        bgm.currentTime

    );

},1000);

/* 当前播放 */

let currentPlayingSong =
null;

/* render */

async function renderSongs(){

    rankWrap.innerHTML = "";

    let songData = [];

    /* 读取 */

    let { data,error } =

    await supabase

    .from("songs")

    .select("*");

    /* 炸了也显示 */

    if(error){

        console.log(error);

        data = [];
    }

    /* 转换 */

    data.forEach(docu=>{

        songData.push({

            name:docu.name,

            likes:
            docu.likes || 0

        });

    });

    /* 自动补歌 */

    for(let song of songs){

        const exists =
        songData.find(
        s=>s.name===song
        );

        if(!exists){

            await supabase
            .from("songs")
            .insert([

                {

                    name:song,

                    likes:0

                }

            ]);

            songData.push({

                name:song,

                likes:0

            });
        }
    }

    /* 排序 */

    songData.sort(
    (a,b)=>
    b.likes - a.likes
    );

    /* create */

    songData.forEach((song,index)=>{

        const card =
        document.createElement(
        "div"
        );

        card.className =
        "song-card";

        card.innerHTML = `

        <div>

        ${index + 1}.
        ${song.name}

        </div>

        <div class="right">

            <div
            class="play-btn"
            data-song="${song.name}">
            ▷
            </div>

            <div class="like-count">
            ${song.likes}
            </div>

            <div class="heart">
            ♡
            </div>

        </div>

        `;

        const playBtn =
        card.querySelector(
        ".play-btn"
        );

        const heart =
        card.querySelector(
        ".heart"
        );

        const likeCount =
        card.querySelector(
        ".like-count"
        );

        /* local */

        let likedSongs =

        JSON.parse(

            localStorage.getItem(
            "likedSongs"
            ) || "[]"

        );

        /* 恢复 */

        if(
        likedSongs.includes(
        song.name
        )
        ){

            heart.innerHTML =
            "♥";

            heart.style.color =
            "#ff8ea1";
        }

        /* 点赞 */

        heart.onclick =
        async ()=>{

            let newLikes;

            /* 取消 */

            if(
            likedSongs.includes(
            song.name
            )
            ){

                likedSongs =
                likedSongs.filter(
                item =>
                item !== song.name
                );

                localStorage.setItem(

                    "likedSongs",

                    JSON.stringify(
                    likedSongs
                    )

                );

                newLikes =
                parseInt(
                likeCount.innerHTML
                ) - 1;

                heart.innerHTML =
                "♡";

                heart.style.color =
                "#ccb7bf";
            }

            /* 点赞 */

            else{

                likedSongs.push(
                song.name
                );

                localStorage.setItem(

                    "likedSongs",

                    JSON.stringify(
                    likedSongs
                    )

                );

                newLikes =
                parseInt(
                likeCount.innerHTML
                ) + 1;

                heart.innerHTML =
                "♥";

                heart.style.color =
                "#ff8ea1";
            }

            likeCount.innerHTML =
            newLikes;

            await supabase
            .from("songs")
            .update({

                likes:newLikes

            })
            .eq(
            "name",
            song.name
            );

            renderSongs();
        };

        /* 播放 */

        playBtn.onclick = ()=>{

            const currentSong =
            playBtn.getAttribute(
            "data-song"
            );

            /* 暂停 */

            if(

            currentPlayingSong
            ===
            currentSong

            &&

            !player.paused

            ){

                player.pause();

                playBtn.innerHTML =
                "▷";

                currentPlayingSong =
                null;

                bgm.volume = 1;

                return;
            }

            /* 全恢复 */

            document
            .querySelectorAll(
            ".play-btn"
            )
            .forEach(btn=>{

                btn.innerHTML =
                "▷";

            });

            bgm.volume = 0;

            currentPlayingSong =
            currentSong;

            player.src =

            "audioSource/" +

            currentSong +

            ".mp3";

            player.play();

            playBtn.innerHTML =
            "❚❚";

            player.onended = ()=>{

                playBtn.innerHTML =
                "▷";

                currentPlayingSong =
                null;

                bgm.volume = 1;
            };
        };

        rankWrap.appendChild(
        card
        );

    });

}

renderSongs();

</script>

</body>
</html>
