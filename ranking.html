<!DOCTYPE html>

<html lang="zh">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>从夯到拉大排名</title>

<style>

body{

    margin:0;

    background:
    linear-gradient(
    to bottom right,
    #f8f2f3,
    #f5efef,
    #f6f1f7
    );

    font-family:
    "Times New Roman",
    "STSong",
    serif;

    overflow-x:hidden;
}

/* back */

.back-btn{

    position:fixed;

    top:38px;

    left:42px;

    color:#a8929b;

    font-size:18px;

    font-style:italic;

    cursor:pointer;

    z-index:999;

    transition:0.3s;

    text-decoration:none;
}

.back-btn:hover{

    transform:translateX(-4px);

    color:#8f7982;
}

/* title */

.title{

    text-align:center;

    margin-top:70px;

    font-size:38px;

    font-style:italic;

    color:#aa8f98;
}

/* list */

.rank-wrap{

    width:520px;

    max-width:88%;

    margin:auto;

    margin-top:42px;

    margin-bottom:80px;
}

/* card */

.song-card{

    width:100%;

    height:56px;

    background:
    rgba(255,255,255,0.45);

    backdrop-filter:blur(12px);

    border-radius:22px;

    padding-left:22px;

    display:flex;

    align-items:center;

    margin-bottom:12px;

    font-size:17px;

    color:#a58d97;

    box-sizing:border-box;

    transition:0.3s;
}

.song-card:hover{

    transform:translateY(-3px);

    background:
    rgba(255,255,255,0.72);
}

/* mobile */

@media(max-width:768px){

    .back-btn{

        top:24px;

        left:20px;

        font-size:15px;
    }

    .title{

        font-size:32px;

        margin-top:68px;
    }

    .rank-wrap{

        width:90%;

        margin-top:36px;
    }

    .song-card{

        height:58px;

        font-size:17px;

        border-radius:22px;

        padding-left:20px;
    }
}

</style>

</head>

<body>

<a
href="index.html?entered=true"
class="back-btn">

← 返回歌单

</a>

<div class="title">

从垃到夯大排名

</div>

<div
class="rank-wrap"
id="rankWrap">

</div>

<script>

const songs = [

"野火一季","走马","失眠了","空空","半壶纱",

"要爱我","天赋","小公主","after17",

"末日","心愿便利贴","梁山伯与茱丽叶",

"AlwaysOnline","你的crush降临了吗",

"绿色","爱我你就抱抱我","那时雨",

"东京不太热","一滴泪的时间",

"夏天的风","怪我咯","虚拟","宠坏",

"不要忘记我爱你","树的花语",

"奇妙能力歌","左手右手",

"天龙八部之宿敌","南泥湾",

"越来越不懂","公主殿下","宝贝",

"有雨有雨","粉雾海","宠爱",

"红昭愿","Doll","日不落","怎么了",

"我们","红色高跟鞋","关键词",

"怪物","第57次取消发送",

"凑热闹","嗯哼","不怕",

"如果爱忘了","摆","来不及",

"几分之几","take me hand"

];

const rankWrap =
document.getElementById("rankWrap");

songs.forEach((song,index)=>{

    const card =
    document.createElement("div");

    card.className =
    "song-card";

    card.innerText =
    `${index + 1}. ${song}`;

    rankWrap.appendChild(card);

});

</script>

<audio
id="bgm"
src="bgm.mp3"
loop
style="display:none">
</audio>

<script>

const bgm =
document.getElementById("bgm");

/* 恢复播放时间 */

const savedTime =
localStorage.getItem("bgmTime");

if(savedTime){

    bgm.currentTime =
    parseFloat(savedTime);
}

/* 是否继续播放 */

const shouldPlay =
localStorage.getItem("bgmPlaying");

if(
shouldPlay === "true"
){

    bgm.play();
}

/* 实时记录时间 */

setInterval(()=>{

    localStorage.setItem(
    "bgmTime",
    bgm.currentTime
    );

},1000);

</script>

</body>

</html>
