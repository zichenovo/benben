<!DOCTYPE html>
<html lang="zh">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
从夯到拉大排名
</title>

<style>

body{

    margin:0;

    background:
    linear-gradient(
    to bottom right,
    #f8f2f3,
    #f5efef,
    #f6f1f7
    );

    font-family:
    "Times New Roman",
    "STSong",
    serif;
}

/* 返回 */

.back-btn{

    position:fixed;

    top:36px;
    left:38px;

    color:#b8a2ab;

    font-size:20px;

    font-style:italic;

    cursor:pointer;

    z-index:999;
}

/* 标题 */

.title{

    text-align:center;

    margin-top:90px;

    font-size:48px;

    color:#b8a2ab;

    font-style:italic;

    font-weight:300;
}

/* 歌单 */

#rankWrap{

    width:72%;

    max-width:520px;

    margin:

    34px auto
    80px auto;

    transition:0.25s;
}

/* 卡片 */

.song-card{

    background:
    rgba(255,255,255,0.38);

    border-radius:16px;

    padding:10px 18px;

    margin-bottom:14px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    color:#a7939d;

    font-size:17px;

    min-height:54px;

    box-sizing:border-box;

    backdrop-filter:blur(10px);

    transition:
    0.3s ease;
}

.song-card:hover{

    transform:
    translateY(-2px);

    background:
    rgba(255,255,255,0.5);
}

/* 右边 */

.right{

    display:flex;

    align-items:center;

    gap:18px;
}

/* 播放 */

.play-btn{

    cursor:pointer;

    font-size:18px;

    color:#b59ca6;

    user-select:none;

    width:20px;

    text-align:center;

    transition:0.2s;
}

.play-btn:hover{

    opacity:0.7;
}

/* 心 */

.heart{

    cursor:pointer;

    font-size:17px;

    color:#ccb7bf;

    user-select:none;

    width:18px;

    display:flex;

    align-items:center;

    justify-content:center;

    transform:translateY(-1px);

    transition:0.2s;
}

.heart:hover{

    transform:
    scale(1.1);
}

/* 数字 */

.like-count{

    width:16px;

    text-align:center;
}

/* 手机版 */

@media(max-width:768px){

    .title{

        font-size:28px;

        margin-top:82px;

        margin-bottom:20px;

        line-height:1.1;
    }

    #rankWrap{

        width:86%;

        margin:

        22px auto
        45px auto;
    }

    .song-card{

        padding:7px 14px;

        border-radius:16px;

        margin-bottom:10px;

        min-height:42px;

        font-size:13px;
    }

    .right{

        gap:10px;
    }

    .play-btn{

        font-size:14px;
    }

    .heart{

        font-size:13px;

        width:14px;
    }

    .like-count{

        font-size:13px;
    }

    .back-btn{

        top:20px;
        left:20px;

        font-size:16px;
    }
}

</style>

</head>

<body>

<div
class="back-btn"

onclick="
window.location.href='song.html'
"
>

← 返回歌单

</div>

<div class="title">

从夯到拉大排名

</div>

<div id="rankWrap"></div>

<audio
id="songPlayer"
preload="none">
</audio>

<audio
id="bgm"
src="bgm.mp3"
loop
style="display:none">
</audio>

<script type="module">

import { createClient }
from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabaseUrl =
"https://bfprkzuculvqajekshfs.supabase.co";

const supabaseKey =
"你的key";

const supabase =
createClient(
supabaseUrl,
supabaseKey
);

/* songs */

const songs = [

"末日","走马","天赋","空空","半壶纱",
"要爱我","失眠了","小公主","after17",
"野火一季","心愿便利贴","梁山伯与茱丽叶",
"AlwaysOnline","你的crush降临了吗",
"绿色","爱我你就抱抱我","那时雨",
"东京不太热","一滴泪的时间",
"夏天的风","怪我咯","虚拟","宠坏",
"不要忘记我爱你","树的花语",
"奇妙能力歌","左手右手",
"天龙八部之宿敌","南泥湾",
"越来越不懂","公主殿下","宝贝",
"有雨有雨","粉雾海","宠爱",
"红昭愿","Doll","日不落","怎么了",
"我们","红色高跟鞋","关键词",
"怪物","第57次取消发送",
"凑热闹","嗯哼","不怕",
"如果爱忘了","摆","来不及",
"几分之几","take me hand"

];

const rankWrap =
document.getElementById("rankWrap");

const player =
document.getElementById("songPlayer");

const bgm =
document.getElementById("bgm");

/* bgm */

const savedTime =
localStorage.getItem("bgmTime");

if(savedTime){

    bgm.currentTime =
    parseFloat(savedTime);
}

bgm.volume = 1;

bgm.play().catch(()=>{});

setInterval(()=>{

    localStorage.setItem(
    "bgmTime",
    bgm.currentTime
    );

},1000);

let currentPlayingSong =
null;

/* loading */

rankWrap.innerHTML = `

<div style="
text-align:center;
padding:40px;
color:#b8a2ab;
font-size:18px;
font-style:italic;
">
Loading...
</div>

`;

async function setupSongs(){

    let { data } =

    await supabase
    .from("songs")
    .select("*");

    const existingNames =
    data.map(item=>item.name);

    const missingSongs =
    songs.filter(
    song=>!existingNames.includes(song)
    );

    if(missingSongs.length > 0){

        await supabase
        .from("songs")
        .insert(

            missingSongs.map(song=>({

                name:song,
                likes:0

            }))

        );
    }
}

function createCard(song,index){

    const card =
    document.createElement("div");

    card.className =
    "song-card";

    let likedSongs =

    JSON.parse(

        localStorage.getItem(
        "likedSongs"
        ) || "[]"

    );

    const liked =
    likedSongs.includes(song.name);

    card.innerHTML = `

    <div>

    ${index + 1}.
    ${song.name}

    </div>

    <div class="right">

        <div
        class="play-btn"
        data-song="${song.name}">
        ▷
        </div>

        <div class="like-count">
        ${song.likes}
        </div>

        <div
        class="heart"
        style="
        color:${liked ? "#ff8ea1" : "#ccb7bf"};
        "
        >
        ${liked ? "♥" : "♡"}
        </div>

    </div>

    `;

    const playBtn =
    card.querySelector(".play-btn");

    const heart =
    card.querySelector(".heart");

    const likeCount =
    card.querySelector(".like-count");

    /* play */

    playBtn.onclick = ()=>{

        const currentSong =
        playBtn.dataset.song;

        if(

        currentPlayingSong
        ===
        currentSong

        &&

        !player.paused

        ){

            player.pause();

            playBtn.innerHTML =
            "▷";

            currentPlayingSong =
            null;

            bgm.volume = 1;

            return;
        }

        document
        .querySelectorAll(".play-btn")
        .forEach(btn=>{

            btn.innerHTML = "▷";

        });

        bgm.volume = 0.15;

        currentPlayingSong =
        currentSong;

        player.src =

        "audioSource/" +

        currentSong +

        ".mp3";

        player.play();

        playBtn.innerHTML =
        "❚❚";

        player.onended = ()=>{

            playBtn.innerHTML =
            "▷";

            currentPlayingSong =
            null;

            bgm.volume = 1;
        };
    };

    /* like */

    heart.onclick = async ()=>{

        let likedSongs =

        JSON.parse(

            localStorage.getItem(
            "likedSongs"
            ) || "[]"

        );

        let newLikes =
        song.likes;

        if(
        likedSongs.includes(song.name)
        ){

            likedSongs =
            likedSongs.filter(
            s=>s!==song.name
            );

            newLikes--;

            heart.innerHTML = "♡";

            heart.style.color =
            "#ccb7bf";
        }

        else{

            likedSongs.push(song.name);

            newLikes++;

            heart.innerHTML = "♥";

            heart.style.color =
            "#ff8ea1";
        }

        localStorage.setItem(

            "likedSongs",

            JSON.stringify(
            likedSongs
            )

        );

        likeCount.innerHTML =
        newLikes;

        song.likes = newLikes;

        await supabase
        .from("songs")
        .update({
            likes:newLikes
        })
        .eq(
        "name",
        song.name
        );

        loadRankingSmooth();
    };

    return card;
}

async function loadRankingSmooth(){

    let { data,error } =

    await supabase

    .from("songs")

    .select("*")

    .order(
    "likes",
    { ascending:false }
    );

    if(error){

        return;
    }

    rankWrap.style.opacity =
    "0.5";

    setTimeout(()=>{

        rankWrap.innerHTML = "";

        data.forEach((song,index)=>{

            const card =
            createCard(song,index);

            card.style.opacity = "0";

            card.style.transform =
            "translateY(10px)";

            rankWrap.appendChild(card);

            setTimeout(()=>{

                card.style.opacity = "1";

                card.style.transform =
                "translateY(0px)";

            },20);

        });

        rankWrap.style.opacity =
        "1";

    },100);
}

await setupSongs();

loadRankingSmooth();

</script>

</body>
</html>
