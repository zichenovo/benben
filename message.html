<!DOCTYPE html>
<html lang="zh">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>留言板</title>

<style>

@font-face{

    font-family:"benbenfont";

    src:url("今年也要加油鸭.ttf");
}

*{

    margin:0;
    padding:0;

    box-sizing:border-box;
}

body{

    min-height:100vh;

    background:#f8f3f6;

    overflow-x:hidden;

    font-family:
    "Times New Roman",
    "STSong",
    serif;
}

/* ===================== */
/* 返回歌单 */
/* ===================== */

.back-btn{

    position:fixed;

    top:42px;
    left:48px;

    font-size:22px;

    color:#b697a4;

    text-decoration:none;

    opacity:0.82;

    transition:0.3s;

    z-index:10000;
}

.back-btn:hover{

    opacity:1;

    transform:translateX(-4px);
}

/* ===================== */
/* 标题 */
/* ===================== */

.title{

    margin-top:65px;

    text-align:center;

    font-family:"benbenfont";

    font-size:54px;

    letter-spacing:6px;

    background:linear-gradient(
    90deg,
    #9f818c,
    #b39ab3,
    #9fb2c7,
    #c5a4bc
    );

    -webkit-background-clip:text;

    -webkit-text-fill-color:transparent;
}

/* ===================== */
/* 墙 */
/* ===================== */

.wall{

    position:relative;

    width:1000px;

    min-height:420px;

    margin:auto;

    margin-top:60px;

    margin-bottom:120px;
}

/* ===================== */
/* 便利贴 */
/* ===================== */

.note{

    position:absolute;

    width:180px;

    min-height:135px;

    padding:18px;

    border-radius:12px;

    color:#9d8793;

    font-size:15px;

    line-height:1.75;

    word-break:break-word;

    overflow:hidden;

    cursor:pointer;

    box-shadow:

    0 8px 20px rgba(0,0,0,0.07),

    0 0 0 1px rgba(255,255,255,0.35);

    transition:

    transform .35s ease,

    box-shadow .35s ease,

    opacity .35s ease;
}

.note:hover{

    transform:
    scale(1.22)
    rotate(0deg)
    !important;

    z-index:9999 !important;

    box-shadow:

    0 25px 50px rgba(0,0,0,0.14);
}

/* ===================== */
/* 配色 */
/* ===================== */

.c1{

    background:#f6edf2;
}

.c2{

    background:#efe8f8;
}

.c3{

    background:#eef3fa;
}

.c4{

    background:#f7eef5;
}

.c5{

    background:#f2eefb;
}

.popup-note.c1{
    background:#f6edf2;
}

.popup-note.c2{
    background:#efe8f8;
}

.popup-note.c3{
    background:#eef3fa;
}

.popup-note.c4{
    background:#f7eef5;
}

.popup-note.c5{
    background:#f2eefb;
}

/* ===================== */
/* +便利贴 */
/* ===================== */

.add-note{

    position:fixed !important;

    right:40px;

    bottom:40px;

    z-index:99999;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;
}

.plus{

    font-size:38px;

    margin-bottom:8px;
}

/* ===================== */
/* 展开遮罩 */
/* ===================== */

.overlay{

    position:fixed;

    inset:0;

    background:
    rgba(255,245,250,0.45);

    backdrop-filter:blur(8px);

    display:none;

    align-items:center;

    justify-content:center;

    z-index:99999;
}

.overlay.show{

    display:flex;
}

/* ===================== */
/* 展开的便利贴 */
/* ===================== */

.popup-note{

    width:60vw;

    max-width:700px;

    min-height:380px;

    border-radius:18px;

    padding:28px;

    position:relative;

    transition:background .2s ease;

    box-shadow:
    0 25px 60px rgba(0,0,0,0.12);
}

/* ===================== */
/* textarea */
/* ===================== */

.message-input{

    width:100%;

    height:250px;

    border:none;

    resize:none;

    outline:none;

    background:transparent;

    color:#8f7c86;

    font-size:18px;

    line-height:1.9;

    font-family:
    "Times New Roman",
    "STSong",
    serif;
}

.message-input::placeholder{

    color:#bcaab4;
}

/* ===================== */
/* ✓ */
/* ===================== */


.color-picker{

    position:absolute;

    right:90px;

    bottom:28px;

    display:flex;

    gap:10px;
}

.color-dot{

    width:18px;

    height:18px;

    border-radius:4px;

    cursor:pointer;

    border:2px solid rgba(255,255,255,0.7);
}

.color-dot:hover{

    transform:scale(1.15);
}

.color-dot.selected{

    transform:scale(1.25);

    border:
    2px solid #9f818c;
}

.save-btn{

    position:absolute;

    right:24px;

    bottom:20px;

    width:46px;

    height:46px;

    border-radius:50%;

    border:none;

    cursor:pointer;

    background:
    rgba(255,255,255,0.7);

    color:#a58d9b;

    font-size:24px;

    transition:.25s;
}

.save-btn:hover{

    transform:scale(1.08);
}

/* ===================== */
/* 查看留言 */
/* ===================== */

.read-content{

    color:#8f7c86;

    font-size:20px;

    line-height:2;

    white-space:pre-wrap;

    padding-bottom:50px;
}

/* ===================== */
/* 手机 */
/* ===================== */

@media(max-width:768px){

.color-picker{

    right:70px;

    bottom:20px;

    gap:7px;
}

.color-dot{

    width:15px;

    height:15px;
}

body{

    overflow-x:hidden;
}

.back-btn{

    top:24px;

    left:22px;

    font-size:16px;
}

.title{

    margin-top:90px;

    font-size:34px;

    letter-spacing:2px;
}

.wall{

    width:95vw;

    min-height:450px;

    margin-top:30px;
}

.note{

    width:130px;

    min-height:100px;

    padding:12px;

    font-size:13px;
}

.note:hover{

    transform:none !important;
}

.popup-note{

    width:82vw;

    min-height:260px;

    padding:22px;
}

.message-input{

    height:170px;

    font-size:16px;
}

.read-content{

    font-size:16px;
}

.save-btn{

    width:42px;

    height:42px;

    font-size:20px;
}
}

</style>

</head>

<body>

<a
href="index.html?entered=true&resume=true"
class="back-btn">

← 返回歌单

</a>

<div class="title">

留言板

</div>

<div
class="wall"
id="wall">

</div>

<div
class="overlay"
id="overlay">

<div
class="popup-note"
id="popupNote">

<textarea
id="messageInput"
class="message-input"
placeholder="写点什么吧..."></textarea>

<div
id="readContent"
class="read-content"
style="display:none;"></div>

<div class="color-picker">

<div class="color-dot c1"
data-color="c1"></div>

<div class="color-dot c2"
data-color="c2"></div>

<div class="color-dot c3"
data-color="c3"></div>

<div class="color-dot c4"
data-color="c4"></div>

<div class="color-dot c5"
data-color="c5"></div>

</div>

<button
class="save-btn"
id="saveBtn">

✓

</button>

</div>

</div>

<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabaseUrl =
"https://bfprkzuculvqajekshfs.supabase.co";

const supabaseKey =
"sb_publishable_RwapQC6PL9Dg54GWxd7lYQ_eJGOETc4";

const supabase =
createClient(
supabaseUrl,
supabaseKey
);

const wall =
document.getElementById("wall");

const overlay =
document.getElementById("overlay");

const popupNote =
document.getElementById("popupNote");

const messageInput =
document.getElementById("messageInput");

const saveBtn =
document.getElementById("saveBtn");

const readContent =
document.getElementById("readContent");

const colorPicker =
document.querySelector(
".color-picker"
);

let currentReadMode = false;

let selectedColor = "c1";

popupNote.classList.add("c1");

let noteIndex = 0;

/* ===================== */
/* localStorage */
/* ===================== */

let messages = [];

/* ===================== */
/* 颜色 */
/* ===================== */

const colors =

["c1","c2","c3","c4","c5"];

document
.querySelectorAll(".color-dot")
.forEach(dot=>{

    dot.onclick = ()=>{

    document
    .querySelectorAll(".color-dot")
    .forEach(d=>{

        d.classList.remove(
        "selected"
        );
    });

    dot.classList.add(
    "selected"
    );

    selectedColor =
dot.dataset.color;

popupNote.className =
"popup-note " + selectedColor;
};
});

document
.querySelector(".color-dot")
.classList.add(
"selected"
);

/* ===================== */
/* 创建便利贴 */
/* ===================== */

function createNote(
text,
isAddButton = false,
savedColor = null
){

    const note =
    document.createElement("div");

    note.classList.add("note");

    const color =

    savedColor

    ?

    savedColor

    :

    colors[
    Math.floor(
    Math.random()*colors.length
    )
    ];

    note.classList.add(color);

    if(isAddButton){

    note.classList.add(
    "add-note"
    );

    note.innerHTML =

    `
    <div class="plus">
    +
    </div>

    写点什么吧
    `;

    note.onclick =
    openCreatePanel;

    wall.appendChild(note);

    return;
}


    const preview =

    text.length > 45

    ?

    text.substring(0,45)
    + "..."

    :

    text;

    note.innerText =
    preview;

const isMobile =
window.innerWidth <= 768;

const cols =
isMobile ? 2 : 5;

const horizontalGap =
isMobile ? -30 : -90;

const verticalGap =
isMobile ? -15 : -55;

const noteWidth =
isMobile ? 130 : 180;

const noteHeight =
isMobile ? 100 : 135;

const col =

noteIndex % cols;

const row =

Math.floor(
noteIndex / cols
);

const randomX =
isMobile
?
Math.random() * 25 - 12
:
Math.random() * 100 - 50;

const randomY =
isMobile
?
Math.random() * 20 - 10
:
Math.random() * 80 - 40;

note.style.left =

20 +

col *

(noteWidth + horizontalGap)

+

randomX

+ "px";

note.style.top =

20 +

row *

(noteHeight + verticalGap)

+

randomY

+ "px";

note.style.transform =

`rotate(${
-12 + Math.random()*24
}deg)`;

noteIndex++;

    note.style.zIndex =

    Math.floor(
    Math.random()*50
    );

    note.onclick = ()=>{

    openReadPanel(
        text,
        color
    );
};

    wall.appendChild(note);
}

/* ===================== */
/* 新建 */
/* ===================== */

function openCreatePanel(){

    currentReadMode = false;

    overlay.classList.add(
    "show"
    );

    messageInput.style.display =
    "block";

    saveBtn.style.display =
    "block";

    colorPicker.style.display =
    "flex";

    readContent.style.display =
    "none";

    messageInput.value = "";

    selectedColor = "c1";

popupNote.className =
"popup-note c1";

document
.querySelectorAll(".color-dot")
.forEach(d=>{

    d.classList.remove(
    "selected"
    );
});

document
.querySelector(
'.color-dot[data-color="c1"]'
).classList.add(
"selected"
);

    popupNote.className =
"popup-note " + selectedColor;

    messageInput.focus();
}

/* ===================== */
/* 阅读 */
/* ===================== */

function openReadPanel(
text,
color
){

    currentReadMode = true;

    overlay.classList.add(
    "show"
    );

    messageInput.style.display =
    "none";

    saveBtn.style.display =
    "none";

    readContent.style.display =
    "block";

    readContent.innerText =
    text;

    popupNote.classList.remove(
"c1","c2","c3","c4","c5"
);

popupNote.classList.add(
color
);

colorPicker.style.display =
"none";
}

/* ===================== */
/* 保存 */
/* ===================== */

saveBtn.onclick = async ()=>{

    const text =

    messageInput.value.trim();

    if(text === ""){

        return;
    }

    const { error } =

await supabase

.from("message_board")

.insert([{

    text:text,

    color:selectedColor

}]);

if(error){

    console.log(error);

    return;
}

    await loadMessages();

    overlay.classList.remove(
    "show"
    );
};

/* ===================== */
/* 点击遮罩关闭 */
/* ===================== */

overlay.addEventListener(

"click",

function(e){

    if(
    e.target === overlay
    ){

        overlay.classList.remove(
        "show"
        );
    }
}
);

/* ===================== */
/* 渲染 */
/* ===================== */

async function loadMessages(){

    const { data, error } =

    await supabase

    .from("message_board")

    .select("*")

    .order(
        "created_at",
        { ascending:true }
    );

    if(error){

        console.log(error);
        return;
    }

    messages = data;

    renderWall();
}


function renderWall(){

    wall.innerHTML = "";

    noteIndex = 0;

    messages.forEach(msg=>{

    createNote(
        msg.text,
        false,
        msg.color
    );
});

const isMobile =
window.innerWidth <= 768;

const rows =

Math.ceil(
messages.length /
(isMobile ? 2 : 5)
);

wall.style.minHeight =

Math.max(

420,

rows * 190 + 200

)

+ "px";

    createNote("",true);
}

/* ===================== */
/* 首次加载 */
/* ===================== */

loadMessages();

</script>
```


</body>
