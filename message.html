.back-btn{

    position:fixed;

    top:42px;

    #b39ab3,

    -webkit-text-fill-color:transparent;

/* ===================== */

.wall{

    width:1000px;

    min-height:900px;

    margin-bottom:120px;

/* ===================== */

.note{

    position:absolute;

    width:180px;

    min-height:135px;

    padding:18px;

    border-radius:12px;

    color:#9d8793;

    font-size:15px;

    line-height:1.75;

    word-break:break-word;

    overflow:hidden;

    cursor:pointer;

    box-shadow:

    0 8px 20px rgba(0,0,0,0.07),

    0 0 0 1px rgba(255,255,255,0.35);

    transition:

    transform .35s ease,

    box-shadow .35s ease,

    opacity .35s ease;
}

.note:hover{

    transform:
    scale(1.22)
    rotate(0deg)
    !important;

    z-index:9999 !important;

    box-shadow:

    0 25px 50px rgba(0,0,0,0.14);
}

/* 配色 */
/* ===================== */

.c1{

    background:#f6edf2;
}

.c2{

    background:#efe8f8;
}

.c3{

    background:#eef3fa;
}

.c4{

    background:#f7eef5;
}

.c5{

    background:#f2eefb;
}

.add-note{

.plus{

/* ===================== */

.overlay{

    inset:0;

    justify-content:center;

.overlay.show{

}

<script>

const wall =
document.getElementById("wall");

const overlay =
document.getElementById("overlay");

const popupNote =
document.getElementById("popupNote");

const messageInput =
document.getElementById("messageInput");

const saveBtn =
document.getElementById("saveBtn");

const readContent =
document.getElementById("readContent");

let currentReadMode = false;

/* ===================== */
/* localStorage */
/* ===================== */

let messages =

JSON.parse(

localStorage.getItem(
"benbenMessages"
)

) || [];

/* ===================== */
/* 颜色 */
/* ===================== */

const colors =

["c1","c2","c3","c4","c5"];

/* ===================== */
/* 创建便利贴 */
/* ===================== */

function createNote(
text,
isAddButton = false
){

    const note =
    document.createElement("div");

    note.classList.add("note");

    const color =

    colors[
    Math.floor(
    Math.random()*colors.length
    )
    ];

    note.classList.add(color);

    if(isAddButton){

        note.classList.add(
        "add-note"
        );

        note.innerHTML =

        `
        <div class="plus">
        +
        </div>

        写点什么吧
        `;

        note.style.right =
        "0px";

        note.style.bottom =
        "0px";

        note.style.left =
        "auto";

        note.style.top =
        "auto";

        note.style.position =
        "absolute";

        note.style.zIndex =
        "999";

        note.onclick =
        openCreatePanel;

        wall.appendChild(note);

        return;
    }

    const preview =

    text.length > 45

    ?

    text.substring(0,45)
    + "..."

    :

    text;

    note.innerText =
    preview;

    const wallWidth =

    wall.offsetWidth;

    const wallHeight =

    wall.offsetHeight;

    note.style.left =

    Math.random()
    *
    (wallWidth - 220)

    + "px";

    note.style.top =

    Math.random()
    *
    (wallHeight - 180)

    + "px";

    note.style.transform =

    `rotate(${
    -12 + Math.random()*24
    }deg)`;

    note.style.zIndex =

    Math.floor(
    Math.random()*50
    );

    note.onclick = ()=>{

        openReadPanel(text);
    };

    wall.appendChild(note);
}

/* ===================== */
/* 新建 */
/* ===================== */

function openCreatePanel(){

    currentReadMode = false;

    overlay.classList.add(
    "show"
    );

    messageInput.style.display =
    "block";

    saveBtn.style.display =
    "block";

    readContent.style.display =
    "none";

    messageInput.value = "";

    messageInput.focus();
}

/* ===================== */
/* 阅读 */
/* ===================== */

function openReadPanel(text){

    currentReadMode = true;

    overlay.classList.add(
    "show"
    );

    messageInput.style.display =
    "none";

    saveBtn.style.display =
    "none";

    readContent.style.display =
    "block";

    readContent.innerText =
    text;
}

/* ===================== */
/* 保存 */
/* ===================== */

saveBtn.onclick = ()=>{

    const text =

    messageInput.value.trim();

    if(text === ""){

        return;
    }

    messages.push(text);

    localStorage.setItem(

    "benbenMessages",

    JSON.stringify(
    messages
    )

    );

    renderWall();

    overlay.classList.remove(
    "show"
    );
};

/* ===================== */
/* 点击遮罩关闭 */
/* ===================== */

overlay.addEventListener(

"click",

function(e){

    if(
    e.target === overlay
    ){

        overlay.classList.remove(
        "show"
        );
    }
}
);

/* ===================== */
/* 渲染 */
/* ===================== */

function renderWall(){

    wall.innerHTML = "";

    messages.forEach(msg=>{

        createNote(msg);
    });

    createNote("",true);
}

/* ===================== */
/* 首次加载 */
/* ===================== */

renderWall();

</script>
