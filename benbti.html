<!DOCTYPE html>

<html lang="zh">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>benbti</title>

<style>

body{

    margin:0;

    width:100%;

    height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    flex-direction:column;

    background:
    linear-gradient(
    to bottom right,
    #f8f2f3,
    #f5efef,
    #f6f1f7
    );

    font-family:
    "Times New Roman",
    "STSong",
    serif;

    overflow:hidden;

    cursor:pointer;
}

/* title */

.title{

    font-size:64px;

    color:#9f8892;

    font-style:italic;

    font-weight:400;

    letter-spacing:1px;

    transition:0.3s;
}

/* subtitle */

.sub{

    margin-top:22px;

    font-size:17px;

    color:#c5b2bb;

    letter-spacing:6px;

    font-style:italic;

    transition:0.3s;
}

/* arrow */

.arrow{

    margin-top:30px;

    font-size:36px;

    color:#ceb7c1;

    transition:0.3s;

    animation:
    move 1.6s infinite;

    user-select:none;
}

/* hover */

body:hover .title{

    color:#927b85;
}

body:hover .sub{

    color:#bca7b1;
}

body:hover .arrow{

    color:#b89ca8;

    transform:scale(1.08);
}

/* animation */

@keyframes move{

    0%{

        transform:
        translateX(0px);
    }

    50%{

        transform:
        translateX(12px);
    }

    100%{

        transform:
        translateX(0px);
    }
}

/* mobile */

@media(max-width:768px){

    .title{

        font-size:42px;

        text-align:center;

        line-height:1.4;
    }

    .sub{

        font-size:13px;

        letter-spacing:4px;
    }

    .arrow{

        font-size:30px;

        margin-top:24px;
    }
}

/* back */

.back-btn{

    position:fixed;

    top:38px;

    left:42px;

    color:#a8929b;

    font-size:18px;

    font-style:italic;

    cursor:pointer;

    z-index:9999;

    transition:0.3s;
}

.back-btn:hover{

    transform:translateX(-4px);

    color:#8e7881;
}

/* mobile */

@media(max-width:768px){

    .back-btn{

        top:26px;

        left:22px;

        font-size:15px;
    }
}

</style>

</head>

<body

<div
class="back-btn"

onclick="
window.location.href='index.html?entered=true'
">

← 返回歌单

</div>

onclick="
window.location.href='test.html'
"

>

<div class="title">

测测你的 benbti

</div>

<div class="sub">

click to enter

</div>

<div class="arrow">

⟶

</div>

</body>

</html>
