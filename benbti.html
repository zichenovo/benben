<!DOCTYPE html>

<html lang="zh">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>benbti</title>

<style>

body{

    margin:0;

    width:100%;

    height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    flex-direction:column;

    background:
    linear-gradient(
    to bottom right,
    #f8f2f3,
    #f5efef,
    #f6f1f7
    );

    font-family:
    "Times New Roman",
    "STSong",
    serif;

    overflow:hidden;
}

/* title */

.title{

    font-size:64px;

    color:#9f8892;

    font-style:italic;

    font-weight:400;

    letter-spacing:1px;
}

/* subtitle */

.sub{

    margin-top:22px;

    font-size:17px;

    color:#c5b2bb;

    letter-spacing:6px;

    font-style:italic;
}

/* arrow */

.arrow{

    margin-top:30px;

    font-size:36px;

    color:#ceb7c1;

    cursor:pointer;

    transition:0.3s;

    animation:
    move 1.6s infinite;
}

.arrow:hover{

    transform:scale(1.15);

    color:#b89ca8;
}

/* animation */

@keyframes move{

    0%{

        transform:
        translateX(0px);
    }

    50%{

        transform:
        translateX(12px);
    }

    100%{

        transform:
        translateX(0px);
    }
}

/* mobile */

@media(max-width:768px){

    .title{

        font-size:42px;
    }

    .sub{

        font-size:14px;

        letter-spacing:4px;
    }

    .arrow{

        font-size:30px;
    }
}

</style>

</head>

<body>

<div class="title">

测测你的 benbti

</div>

<div class="sub">

click to enter

</div>

<div
class="arrow"

onclick="
window.location.href='test.html'
">

⟶

</div>

</body>

</html>
