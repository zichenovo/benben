<!DOCTYPE html>
<html lang="zh">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>wwti图鉴</title>

<style>

body{

    margin:0;

    background:
    linear-gradient(
    to bottom right,
    #f8f2f3,
    #f5efef,
    #f6f1f7
    );

    font-family:
    "Times New Roman",
    "STSong",
    serif;

    overflow-x:hidden;
}

/* 返回按钮 */

.back-btn{

    position:fixed;

    top:36px;
    left:38px;

    color:#b8a2ab;

    font-size:20px;

    font-style:italic;

    cursor:pointer;

    transition:0.3s;

    user-select:none;

    z-index:999;
}

.back-btn:hover{

    color:#cfb5bf;

    transform:translateX(-4px);
}

/* 标题 */

.title{

    text-align:center;

    margin-top:70px;

    color:#c4aeb6;

    font-size:64px;

    font-style:italic;

    font-weight:400;

    letter-spacing:4px;

    font-family:
    "Times New Roman",
    "STSong",
    serif;
}

/* 卡片排列 */

.card-container{

    width:100%;

    margin-top:90px;
    margin-bottom:80px;

    display:grid;

    grid-template-columns:
    repeat(4,170px);

    justify-content:center;

    gap:60px;
}

/* 卡片 */

.card{

    width:170px;

    height:190px;

    background:#f8f3f1;

    border:1.5px solid #ddd0d0;

    border-radius:12px;

    position:relative;

    transition:0.3s;

    display:flex;

    flex-direction:column;

    align-items:center;

    padding-top:28px;

    box-shadow:
    0 4px 10px rgba(0,0,0,0.03);
}

/* hover */

.card:hover{

    transform:
    translateY(-6px)
    rotate(-1deg);
}

/* 内边框 */

.card::after{

    content:"";

    position:absolute;

    inset:8px;

    border:1px solid #e8dddd;

    border-radius:8px;

    pointer-events:none;
}

/* 图片 */

.card img{

    width:92px;

    height:92px;

    object-fit:cover;

    border-radius:6px;

    border:1px solid #ddd0d0;

    background:#efe8e8;

    z-index:2;
}

/* 名字 */

.card-name{

    margin-top:24px;

    font-size:25px;

    color:#a999a6;

    letter-spacing:1px;

    font-style:italic;

    font-weight:300;

    font-family:
    "Times New Roman",
    "STSong",
    serif;

    z-index:2;

    opacity:0.9;

    text-shadow:
    0 0 8px rgba(255,255,255,0.5);
}

/* 手机 */

@media(max-width:900px){

    .title{

        font-size:46px;

        margin-top:90px;
    }

    .card-container{

        grid-template-columns:
        repeat(2,150px);

        gap:26px;

        margin-top:60px;
    }

    .card{

        width:150px;

        height:210px;
    }

    .card img{

        width:82px;
        height:82px;
    }

    .card-name{

        font-size:24px;

        margin-top:28px;
    }

    .back-btn{

        top:20px;
        left:20px;

        font-size:15px;
    }
}

</style>

</head>

<body>

<div
class="back-btn"

onclick="
window.history.back()
"
>

← 返回上一页

</div>

<div class="title">

wwti 图鉴

</div>

<div class="card-container">

<div class="card">

<img src="image/1.jpg">

<div class="card-name">

吻文而雅

</div>

</div>

<div class="card">

<img src="image/2.jpg">

<div class="card-name">

不闻不吻

</div>

</div>

<div class="card">

<img src="image/3.jpg">

<div class="card-name">

吻风而来

</div>

</div>

<div class="card">

<img src="image/4.jpg">

<div class="card-name">

百吻不如一见

</div>

</div>

<div class="card">

<img src="image/5.jpg">

<div class="card-name">

十拿九吻

</div>

</div>

<div class="card">

<img src="image/6.jpg">

<div class="card-name">

吻酒煮月

</div>

</div>

<div class="card">

<img src="image/7.jpg">

<div class="card-name">

吻故而知新

</div>

</div>

<div class="card">

<img src="image/8.jpg">

<div class="card-name">

人间能得几回吻

</div>

</div>

</div>



</body>

</html>
