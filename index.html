<!DOCTYPE html>
<html lang="zh">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>笨笨的の歌单</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:#f7f3f2;

    overflow:auto;

    font-family:
    "Times New Roman",
    "STSong",
    serif;

    min-width:2100px;
    min-height:1700px;
}

/* 柔和背景 */

body::before{

    content:"";

    position:fixed;

    inset:18px;

    border-radius:36px;

    background:

    radial-gradient(
    circle at top left,
    rgba(255,233,241,0.9),
    transparent 28%
    ),

    radial-gradient(
    circle at bottom center,
    rgba(232,228,255,0.75),
    transparent 35%
    ),

    radial-gradient(
    circle at top right,
    rgba(255,255,255,0.7),
    transparent 30%
    ),

    #f7f2f2;

    border:2px solid rgba(255,255,255,0.5);

    z-index:-1;

    pointer-events:none;

    box-shadow:
    inset 0 0 120px rgba(255,255,255,0.45);
}

/* 左上 */

.header{

    position:fixed;

    top:55px;
    left:65px;

    z-index:999;
}

.title{

    font-size:92px;

    font-weight:700;

    color:#8e7d7f;

    letter-spacing:2px;
}

/* 搜索框 */

.search-box{

    margin-top:24px;

    width:370px;
    height:62px;

    border:none;

    border-radius:40px;

    padding-left:30px;

    font-size:30px;

    background:rgba(255,255,255,0.62);

    backdrop-filter:blur(12px);

    outline:none;

    color:#9f8f92;

    box-shadow:
    0 10px 30px rgba(0,0,0,0.04);
}

/* 右上 */

.tip{

    position:fixed;

    top:85px;
    right:100px;

    font-size:24px;

    color:#c8afe9;

    letter-spacing:2px;

    font-style:italic;

    z-index:999;
}

/* 歌词区域 */

.song-area{

    position:relative;

    width:2100px;
    height:1700px;
}

/* 歌名 */

.song{

    position:absolute;

    cursor:pointer;

    white-space:nowrap;

    transition:
    transform 0.35s ease,
    opacity 0.35s ease,
    color 0.35s ease;

    font-style:italic;

    animation:
    floaty ease-in-out infinite;
}

/* hover */

.song:hover{

    transform:
    scale(1.06)
    translateY(-4px);

    color:#b17fff;

    z-index:99;
}

/* 字体大小 */
/* 全部整体缩小 */

.small{

    font-size:20px;
    opacity:0.38;
}

.medium{

    font-size:34px;
    opacity:0.58;
}

.large{

    font-size:52px;
    opacity:0.75;
}

/* 配色 */

.song:nth-child(7n+1){
    color:#b59dcf;
}

.song:nth-child(7n+2){
    color:#95a9c7;
}

.song:nth-child(7n+3){
    color:#b7a3b5;
}

.song:nth-child(7n+4){
    color:#c2a7d8;
}

.song:nth-child(7n+5){
    color:#9c8f97;
}

.song:nth-child(7n+6){
    color:#b0a0be;
}

.song:nth-child(7n){
    color:#8ea0b7;
}

/* 浮动 */

.song:nth-child(odd){

    animation-duration:10s;
}

.song:nth-child(even){

    animation-duration:14s;
}

@keyframes floaty{

    0%{
        transform:
        translateY(0px)
        translateX(0px);
    }

    25%{
        transform:
        translateY(-8px)
        translateX(6px);
    }

    50%{
        transform:
        translateY(5px)
        translateX(-5px);
    }

    75%{
        transform:
        translateY(-5px)
        translateX(4px);
    }

    100%{
        transform:
        translateY(0px)
        translateX(0px);
    }
}

/* 音符 */

.note{

    position:absolute;

    color:#e7dcff;

    opacity:0.32;

    pointer-events:none;

    animation:
    drift linear infinite;
}

@keyframes drift{

    from{

        transform:
        translateY(0px)
        translateX(0px)
        rotate(0deg);
    }

    to{

        transform:
        translateY(-130px)
        translateX(45px)
        rotate(16deg);
    }
}

</style>
</head>

<body>

<div class="header">

    <div class="title">
        笨笨的の歌单
    </div>

    <input
    class="search-box"
    id="searchInput"
    placeholder="试试搜索">

</div>

<div class="tip">
    点击歌名可以试听～
</div>

<div class="song-area" id="songArea"></div>

<script>

const songs = [

"末日","走马","天赋","空空","半壶纱",
"要爱我","失眠了","小公主","after17",
"野火一季","心愿便利贴","梁山伯与朱丽叶",
"AlwaysOnline","你的crush降临了吗",
"绿色","爱我你就抱抱我","那时雨",
"东京不太热","一滴泪的时间",
"夏天的风","怪我咯","虚拟","宠坏",
"不要忘记我爱你","树的花语",
"奇妙能力歌","左手右手",
"天龙八部之宿敌","南泥湾",
"越来越不懂","公主殿下","宝贝",
"有雨有雨","粉雾海","宠爱",
"红昭愿","Doll","日不落","怎么了",
"我们","红色高跟鞋","关键词",
"怪物","第57次取消发送",
"凑热闹","嗯哼","不怕",
"如果爱忘了","摆",
"几分之几","take me hand"

];

const songArea =
document.getElementById("songArea");

/* 生成歌名 */

songs.forEach(songName=>{

    const song =
    document.createElement("div");

    const random =
    Math.random();

    let sizeClass = "small";

    if(random > 0.7){
        sizeClass = "medium";
    }

    if(random > 0.9){
        sizeClass = "large";
    }

    song.className =
    "song " + sizeClass;

    song.innerText =
    songName;

    /* 不那么分散 */

    const x =
    180 + Math.random()*1600;

    const y =
    240 + Math.random()*1150;

    song.style.left =
    x + "px";

    song.style.top =
    y + "px";

    song.onclick = ()=>{

        window.location.href =
        "song.html?song=" +
        encodeURIComponent(songName);
    };

    songArea.appendChild(song);
});

/* 搜索 */

document
.getElementById("searchInput")
.addEventListener("keypress",function(e){

    if(e.key==="Enter"){

        const value =
        this.value.trim();

        if(songs.includes(value)){

            window.location.href =
            "song.html?song=" +
            encodeURIComponent(value);

        }else{

            alert(
            "不好意思 笨笨的还没学会《"
            + value +
            "》 已加入待学歌单～"
            );
        }
    }
});

/* 音符 */

for(let i=0;i<42;i++){

    const note =
    document.createElement("div");

    note.className = "note";

    const symbols =
    ["♪","♫","♬","♩","𝄞"];

    note.innerText =
    symbols[
    Math.floor(
    Math.random()*symbols.length
    )];

    note.style.left =
    Math.random()*2100 + "px";

    note.style.top =
    Math.random()*1700 + "px";

    note.style.fontSize =
    20 + Math.random()*42 + "px";

    note.style.animationDuration =
    13 + Math.random()*18 + "s";

    songArea.appendChild(note);
}

</script>

</body>
</html>
