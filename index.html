<!DOCTYPE html>
<html lang="zh">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>笨笨的の歌单</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:
    radial-gradient(circle at top left,#f8e9ef 0%,transparent 30%),
    radial-gradient(circle at bottom right,#ebe7ff 0%,transparent 30%),
    #f6f1f0;

    overflow:auto;

    font-family:
    "Times New Roman",
    "STSong",
    serif;

    color:#8f7f84;

    min-width:2200px;
    min-height:1800px;
}

/* 左上标题 */

.header{
    position:fixed;

    top:50px;
    left:60px;

    z-index:999;
}

.title{

    font-size:92px;

    font-weight:700;

    color:#8d7d7b;

    letter-spacing:2px;
}

/* 搜索框 */

.search-box{

    margin-top:25px;

    width:370px;
    height:58px;

    border-radius:40px;

    border:none;

    padding-left:28px;

    font-size:30px;

    background:rgba(255,255,255,0.62);

    backdrop-filter:blur(10px);

    outline:none;

    color:#8f7f84;

    box-shadow:
    0 8px 25px rgba(0,0,0,0.05);
}

/* 右上角文字 */

.tip{

    position:fixed;

    top:70px;
    right:90px;

    font-size:24px;

    color:#c4aee7;

    font-style:italic;

    letter-spacing:2px;

    z-index:999;
}

/* 歌单区域 */

.song-area{

    position:relative;

    width:2200px;
    height:1800px;

    padding-top:180px;
}

/* 歌名 */

.song{

    position:absolute;

    font-style:italic;

    color:#9f8f97;

    cursor:pointer;

    transition:
    transform 0.5s ease,
    color 0.5s ease,
    opacity 0.5s ease;

    user-select:none;

    white-space:nowrap;

    opacity:0.82;

    animation:floaty ease-in-out infinite;
}

/* 大小 */

.song.small{
    font-size:24px;
    opacity:0.55;
}

.song.medium{
    font-size:38px;
    opacity:0.72;
}

.song.large{
    font-size:58px;
    opacity:0.96;
}

/* hover */

.song:hover{

    color:#a98ad6;

    transform:
    scale(1.18)
    translateY(-6px);

    opacity:1;

    z-index:99;
}

/* 漂浮动画 */

.song:nth-child(odd){
    animation-duration:7s;
}

.song:nth-child(even){
    animation-duration:11s;
}

@keyframes floaty{

    0%{
        transform:
        translateY(0px)
        translateX(0px);
    }

    25%{
        transform:
        translateY(-10px)
        translateX(8px);
    }

    50%{
        transform:
        translateY(4px)
        translateX(-10px);
    }

    75%{
        transform:
        translateY(-8px)
        translateX(6px);
    }

    100%{
        transform:
        translateY(0px)
        translateX(0px);
    }
}

/* 飘动音符 */

.note{

    position:absolute;

    color:#dbcdf6;

    opacity:0.35;

    animation:
    drift linear infinite;

    pointer-events:none;
}

@keyframes drift{

    from{
        transform:
        translateY(0px)
        translateX(0px)
        rotate(0deg);
    }

    to{
        transform:
        translateY(-120px)
        translateX(40px)
        rotate(20deg);
    }
}

</style>
</head>

<body>

<div class="header">

    <div class="title">
        笨笨的の歌单
    </div>

    <input
    class="search-box"
    id="searchInput"
    placeholder="试试搜索">

</div>

<div class="tip">
    click a song to explore
</div>

<div class="song-area" id="songArea"></div>

<script>

const songs = [

"末日",
"走马",
"天赋",
"空空",
"半壶纱",
"要爱我",
"失眠了",
"小公主",
"after17",
"野火一季",
"心愿便利贴",
"梁山伯与朱丽叶",
"AlwaysOnline",
"你的crush降临了吗",
"绿色",
"爱我你就抱抱我",
"那时雨",
"东京不太热",
"一滴泪的时间",
"夏天的风",
"怪我咯",
"虚拟",
"宠坏",
"不要忘记我爱你",
"树的花语",
"奇妙能力歌",
"左手右手",
"天龙八部之宿敌",
"南泥湾",
"越来越不懂",
"公主殿下",
"宝贝",
"有雨有雨",
"粉雾海",
"宠爱",
"红昭愿",
"Doll",
"日不落",
"怎么了",
"我们",
"红色高跟鞋",
"关键词",
"怪物",
"第57次取消发送",
"凑热闹",
"嗯哼",
"不怕",
"如果爱忘了",
"摆",
"几分之几",
"take me hand"

];

const songArea =
document.getElementById("songArea");

/* 生成歌名 */

songs.forEach(songName=>{

    const song =
    document.createElement("div");

    const sizes =
    ["small","medium","large"];

    const randomSize =
    sizes[
    Math.floor(
    Math.random()*sizes.length
    )];

    song.className =
    "song " + randomSize;

    song.innerText =
    songName;

    const x =
    200 + Math.random()*1700;

    const y =
    200 + Math.random()*1300;

    song.style.left =
    x + "px";

    song.style.top =
    y + "px";

    /* 点击跳转 */

    song.onclick = ()=>{

        window.location.href =
        "song.html?song=" +
        encodeURIComponent(songName);
    };

    songArea.appendChild(song);
});

/* 搜索 */

document
.getElementById("searchInput")
.addEventListener("keypress",function(e){

    if(e.key==="Enter"){

        const value =
        this.value.trim();

        if(songs.includes(value)){

            window.location.href =
            "song.html?song=" +
            encodeURIComponent(value);

        }else{

            alert(
            "不好意思 笨笨的还没学会《"
            + value +
            "》 已加入待学歌单～"
            );
        }
    }
});

/* 音符漂浮 */

for(let i=0;i<40;i++){

    const note =
    document.createElement("div");

    note.className = "note";

    const symbols =
    ["♪","♫","♬","♩"];

    note.innerText =
    symbols[
    Math.floor(
    Math.random()*symbols.length
    )];

    note.style.left =
    Math.random()*2200 + "px";

    note.style.top =
    Math.random()*1800 + "px";

    note.style.fontSize =
    20 + Math.random()*45 + "px";

    note.style.animationDuration =
    10 + Math.random()*20 + "s";

    songArea.appendChild(note);
}

</script>

</body>
</html>
