<!DOCTYPE html>
<html lang="zh">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>笨笨的の歌单</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:#f7f3f2;

    overflow:auto;

    font-family:
    "Times New Roman",
    "STSong",
    serif;
}

/* 背景 */

body::before{

    content:"";

    position:fixed;

    inset:18px;

    border-radius:38px;

    background:

    radial-gradient(
    circle at top left,
    rgba(255,233,241,0.9),
    transparent 28%
    ),

    radial-gradient(
    circle at bottom center,
    rgba(232,228,255,0.78),
    transparent 35%
    ),

    radial-gradient(
    circle at right top,
    rgba(255,255,255,0.7),
    transparent 30%
    ),

    #f7f2f2;

    border:2px solid rgba(255,255,255,0.55);

    z-index:-1;

    pointer-events:none;

    box-shadow:
    inset 0 0 120px rgba(255,255,255,0.45);
}

/* desktop */

.desktop{

    min-width:2200px;
    min-height:1800px;
}

/* mobile */

.mobile{

    min-width:100vw;
    min-height:100vh;

    overflow-x:hidden;
}

/* header */

.header{

    position:fixed;

    z-index:999;
}

/* title */

.title{

    font-weight:500;

    color:#8f7e82;

    letter-spacing:2px;

    font-style:italic;

    line-height:1;

    font-family:
    "Times New Roman",
    "Kaiti SC",
    serif;
}

/* search */

.search-box{

    border:none;

    outline:none;

    background:
    rgba(255,255,255,0.55);

    backdrop-filter:blur(10px);

    color:#a39296;

    transition:0.3s;
}

.search-box::placeholder{

    color:#c8bcc0;
}

/* tip */

.tip{

    position:fixed;

    color:#c8afe9;

    font-style:italic;

    z-index:999;
}

/* song area */

.song-area{

    position:relative;

    perspective:1200px;

    overflow:hidden;
}

/* songs */

.song{

    position:absolute;

    cursor:pointer;

    white-space:nowrap;

    transition:
    transform 0.35s ease,
    opacity 0.35s ease,
    color 0.35s ease;

    font-style:italic;

    font-family:
    "Times New Roman",
    "STSong",
    serif;

    animation:
    floatDepth linear infinite;

    mix-blend-mode:screen;
}

.song:hover{

    transform:
    scale(1.55)
    translateY(-12px)
    translateZ(180px);

    color:#f1d9ff;

    opacity:1;

    z-index:9999;

    text-shadow:

    0 0 12px rgba(255,255,255,1),

    0 0 30px rgba(232,190,255,1),

    0 0 60px rgba(214,170,255,0.95),

    0 0 120px rgba(214,170,255,0.55);
}

/* size */

.small{
    opacity:0.34;
}

.medium{
    opacity:0.55;
}

.large{
    opacity:0.72;
}

/* colors */

.song:nth-child(7n+1){
    color:#b59dcf;
}

.song:nth-child(7n+2){
    color:#95a9c7;
}

.song:nth-child(7n+3){
    color:#b7a3b5;
}

.song:nth-child(7n+4){
    color:#c2a7d8;
}

.song:nth-child(7n+5){
    color:#9c8f97;
}

.song:nth-child(7n+6){
    color:#b0a0be;
}

.song:nth-child(7n){
    color:#8ea0b7;
}

/* floating */

@keyframes floatDepth{

    0%{

        transform:
        translateZ(0px)
        translateY(0px);

        opacity:0.45;
    }

    50%{

        transform:
        translateZ(120px)
        translateY(-20px);

        opacity:0.9;
    }

    100%{

        transform:
        translateZ(0px)
        translateY(0px);

        opacity:0.45;
    }
}

/* notes */

.note{

    position:absolute;

    color:#eadfff;

    pointer-events:none;

    animation:
    musicMove linear infinite;
}

@keyframes musicMove{

    0%{

        transform:
        translate3d(0,300px,-400px)
        scale(0.2);

        opacity:0;
    }

    20%{
        opacity:0.18;
    }

    50%{

        transform:
        translate3d(0,0px,0px)
        scale(1);

        opacity:0.4;
    }

    100%{

        transform:
        translate3d(0,-500px,300px)
        scale(1.9);

        opacity:0;
    }
}

/* desktop */

.desktop .header{

    top:58px;
    left:68px;
}

.desktop .title{

    font-size:84px;
}

.desktop .search-box{

    margin-top:20px;

    width:250px;
    height:42px;

    border-radius:30px;

    padding-left:22px;

    font-size:20px;
}

.desktop .tip{

    top:88px;
    right:105px;

    font-size:24px;
}

.desktop .song-area{

    width:2200px;
    height:1800px;
}

.desktop .small{

    font-size:18px;
}

.desktop .medium{

    font-size:30px;
}

.desktop .large{

    font-size:46px;
}

/* mobile */

.mobile::before{

    inset:10px;

    border-radius:24px;
}

.mobile .header{

    top:28px;
    left:24px;
}

.mobile .title{

    font-size:42px;

    line-height:1.1;
}

.mobile .search-box{

    margin-top:14px;

    width:180px;
    height:34px;

    border-radius:20px;

    padding-left:16px;

    font-size:15px;
}

.mobile .tip{

    top:82px;
    right:22px;

    font-size:12px;
}

.mobile .song-area{

    width:100vw;
    height:1800px;
}

.mobile .small{

    font-size:14px;
}

.mobile .medium{

    font-size:22px;
}

.mobile .large{

    font-size:34px;
}

.mobile .song:hover{

    transform:none;

    text-shadow:none;
}

.mobile .song:active{

    transform:scale(1.3);

    color:#f1d9ff;
}

/* music button */

.music-control{

    position:fixed;

    right:22px;
    bottom:22px;

    width:64px;
    height:64px;

    border-radius:50%;

    background:
    rgba(255,255,255,0.32);

    border:
    1px solid rgba(255,255,255,0.4);

    backdrop-filter:blur(16px);

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    color:#ffffff;

    font-size:22px;

    cursor:pointer;

    z-index:999999;

    transition:0.35s;

    box-shadow:

    0 0 30px rgba(255,255,255,0.25),

    inset 0 0 18px rgba(255,255,255,0.22);
}

.music-control:hover{

    transform:scale(1.1);

    background:
    rgba(255,255,255,0.42);
}

.music-text{

    position:absolute;

    bottom:-18px;

    font-size:8px;

    color:#b8aebb;

    white-space:nowrap;

    opacity:0.7;
}

.mobile .music-control{

    width:58px;
    height:58px;

    right:18px;
    bottom:20px;

    font-size:20px;
}

.mobile .music-text{

    font-size:7px;
}

</style>

</head>

<body id="body">

<audio id="bgm" loop preload="auto">

    <source src="bgm.mp3" type="audio/mpeg">

</audio>

<div class="header">

    <div class="title">
        笨笨的の歌单
    </div>

    <input
    class="search-box"
    id="searchInput"
    placeholder="试试搜索">

</div>

<div class="tip">
    点击歌名可以试听～
</div>

<div class="song-area" id="songArea"></div>

<script>

/* ====================== */
/* background music */
/* ====================== */

const bgm =
document.getElementById("bgm");

/* 音量 */

bgm.volume = 0.045;

/* 恢复进度 */

const savedTime =
localStorage.getItem("bgmTime");

if(savedTime){

    bgm.currentTime =
    parseFloat(savedTime);
}

/* 自动播放 */

async function startMusic(){

    try{

        await bgm.play();

    }catch(e){

        console.log("autoplay blocked");
    }
}

/* 页面一加载 */

startMusic();

/* 第一次点击 */

document.addEventListener(

"click",

()=>{

    startMusic();

},

{ once:true }

);

/* 保存进度 */

bgm.addEventListener(

"timeupdate",

()=>{

    localStorage.setItem(

        "bgmTime",

        bgm.currentTime

    );

}

);

/* ====================== */
/* music button */
/* ====================== */

const musicControl =
document.createElement("div");

musicControl.className =
"music-control";

musicControl.innerHTML =

`
⏸
<div class="music-text">
点击这里暂停背景音乐
</div>
`;

document.body.appendChild(
musicControl
);

let isPlaying = true;

musicControl.onclick = ()=>{

    if(isPlaying){

        bgm.pause();

        musicControl.innerHTML =

        `
        ▶
        <div class="music-text">
        点击这里播放背景音乐
        </div>
        `;

    }else{

        bgm.play();

        musicControl.innerHTML =

        `
        ⏸
        <div class="music-text">
        点击这里暂停背景音乐
        </div>
        `;
    }

    isPlaying = !isPlaying;
};

/* device detect */

const isMobile =
window.innerWidth <= 768;

if(isMobile){

    document.body.classList.add("mobile");

}else{

    document.body.classList.add("desktop");
}

/* songs */

const songs = [

"末日","走马","天赋","空空","半壶纱",
"要爱我","失眠了","小公主","after17",
"野火一季","心愿便利贴","梁山伯与朱丽叶",
"AlwaysOnline","你的crush降临了吗",
"绿色","爱我你就抱抱我","那时雨",
"东京不太热","一滴泪的时间",
"夏天的风","怪我咯","虚拟","宠坏",
"不要忘记我爱你","树的花语",
"奇妙能力歌","左手右手",
"天龙八部之宿敌","南泥湾",
"越来越不懂","公主殿下","宝贝",
"有雨有雨","粉雾海","宠爱",
"红昭愿","Doll","日不落","怎么了",
"我们","红色高跟鞋","关键词",
"怪物","第57次取消发送",
"凑热闹","嗯哼","不怕",
"如果爱忘了","摆",
"几分之几","take me hand"

];

const songArea =
document.getElementById("songArea");

/* render */

songs.forEach(songName=>{

    const song =
    document.createElement("div");

    const random =
    Math.random();

    let sizeClass = "small";

    if(random > 0.7){
        sizeClass = "medium";
    }

    if(random > 0.92){
        sizeClass = "large";
    }

    song.className =
    "song " + sizeClass;

    song.innerText =
    songName;

    let x;
    let y;

    if(isMobile){

        x =
        20 + Math.random()*300;

        y =
        180 + Math.random()*1400;

    }else{

        x =
        220 + Math.random()*1500;

        y =
        230 + Math.random()*1200;
    }

    song.style.left =
    x + "px";

    song.style.top =
    y + "px";

    song.style.animationDuration =
    10 + Math.random()*8 + "s";

    song.onclick = ()=>{

        window.location.href =
        "song.html?song=" +
        encodeURIComponent(songName);
    };

    songArea.appendChild(song);
});

/* search */

document
.getElementById("searchInput")
.addEventListener("keypress",function(e){

    if(e.key==="Enter"){

        const value =
        this.value.trim();

        if(songs.includes(value)){

            window.location.href =
            "song.html?song=" +
            encodeURIComponent(value);

        }else{

            alert(
            "不好意思 笨笨的还没学会《"
            + value +
            "》 已加入待学歌单～"
            );
        }
    }
});

/* notes */

let noteCount = 95;

if(isMobile){

    noteCount = 28;
}

for(let i=0;i<noteCount;i++){

    const note =
    document.createElement("div");

    note.className = "note";

    const symbols =
    ["♪","♫","♬","♩","𝄞"];

    note.innerText =
    symbols[
    Math.floor(
    Math.random()*symbols.length
    )];

    if(isMobile){

        note.style.left =
        Math.random()*100 + "vw";

        note.style.top =
        Math.random()*1800 + "px";

    }else{

        note.style.left =
        Math.random()*2200 + "px";

        note.style.top =
        Math.random()*1900 + "px";
    }

    note.style.fontSize =
    16 + Math.random()*55 + "px";

    note.style.animationDuration =
    8 + Math.random()*8 + "s";

    songArea.appendChild(note);
}

</script>

</body>
</html>
