<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>笨笨的の歌单</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100%;
    height:100vh;
    overflow:hidden;

    background:
    radial-gradient(circle at top left,#f8ecee 0%,transparent 35%),
    radial-gradient(circle at bottom right,#f1efea 0%,transparent 35%),
    linear-gradient(135deg,#f7f3f2,#f3efec,#f6f4f1);

    font-family: "Helvetica Neue", sans-serif;
}

/* 标题 */

.title{
    position:absolute;
    left:55px;
    top:40px;

    font-size:78px;
    font-weight:900;

    color:#7d6e68;

    letter-spacing:2px;

    z-index:10;
}

/* 搜索框 */

.search-box{
    position:absolute;

    left:55px;
    top:155px;

    width:360px;
    height:56px;

    border:none;
    outline:none;

    border-radius:999px;

    background:rgba(255,255,255,0.6);

    padding-left:28px;

    font-size:22px;

    color:#8a7d78;

    backdrop-filter:blur(10px);

    box-shadow:
    0 5px 20px rgba(0,0,0,0.03);

    z-index:10;
}

.search-box::placeholder{
    color:#c1b5b0;
}

/* 歌词散落区域 */

.song-container{
    position:relative;
    width:100%;
    height:100vh;
    overflow:hidden;
}

/* 歌名 */

.song{

    position:absolute;

    font-size:30px;

    color:rgba(120,105,120,0.72);

    font-family:"Times New Roman", serif;

    font-style:italic;

    cursor:pointer;

    transition:
    color 0.35s ease,
    transform 0.35s ease,
    opacity 0.35s ease;

    user-select:none;

    letter-spacing:1px;
}

.song:hover{

    color:rgba(185,145,210,0.95);

    transform:
    translate(-50%, -50%)
    scale(1.8);

    z-index:999;
}

/* 小装饰 */

.sparkle{
    position:absolute;
    width:8px;
    height:8px;
    background:#d9c2eb;
    opacity:0.4;
}

.sparkle:nth-child(1){
    left:10%;
    top:20%;
}

.sparkle:nth-child(2){
    left:80%;
    top:15%;
}

.sparkle:nth-child(3){
    left:60%;
    top:70%;
}

.sparkle:nth-child(4){
    left:30%;
    top:80%;
}

.tip{
    position:absolute;
    top:55px;
    right:70px;

    color:#b8a6c8;
    font-size:15px;
    letter-spacing:2px;
    font-style:italic;
}

</style>
</head>

<body>

<div class="title">笨笨的の歌单</div>

<input
class="search-box"
id="searchInput"
placeholder="试试搜索"
/>

<div class="tip">
click a song to explore
</div>

<div class="song-container" id="songs">

<div class="sparkle"></div>
<div class="sparkle"></div>
<div class="sparkle"></div>
<div class="sparkle"></div>

</div>

<script>

const songNames = [

"末日",
"走马",
"天赋",
"空空",
"半壶纱",
"要爱我",
"失眠了",
"小公主",
"after17",
"野火一季",
"心愿便利贴",
"梁山伯与朱丽叶",
"AlwaysOnline",
"你的crush降临了吗",
"绿色",
"爱我你就抱抱我",
"那时雨",
"东京不太热",
"一滴泪的时间",
"夏天的风",
"怪我咯",
"虚拟",
"宠坏",
"不要忘记我爱你",
"树的花语",
"奇妙能力歌",
"左手右手",
"天龙八部之宿敌",
"南泥湾",
"越来越不懂",
"公主殿下",
"宝贝",
"有雨有雨",
"粉雾海",
"宠爱",
"红昭愿",
"等",
"Doll",
"日不落",
"怎么了",
"我们",
"红色高跟鞋",
"关键词",
"怪物",
"第57次取消发送",
"凑热闹",
"嗯哼",
"不怕",
"如果爱忘了",
"摆",
"几分之几",
"take me hand"

];

const container = document.getElementById("songs");

/* 散落位置 */

songNames.forEach(song => {

    const div = document.createElement("div");

    div.className = "song";

    div.innerText = song;

    const x = Math.random() * 80 + 8;
    const y = Math.random() * 72 + 18;

    div.style.left = x + "%";
    div.style.top = y + "%";

    div.onclick = () => {

        window.location.href =
        `song.html?song=${encodeURIComponent(song)}`;

    };

    container.appendChild(div);

});

/* 搜索 */

document
.getElementById("searchInput")
.addEventListener("keypress",function(e){

    if(e.key==="Enter"){

        const value = this.value.trim();

        if(songNames.includes(value)){

            window.location.href =
            `song.html?song=${encodeURIComponent(value)}`;

        }else{

            alert(
            "不好意思 笨笨的还没学会这首歌 已加入待学歌单～"
            );

        }

    }

});

</script>

</body>
</html>
