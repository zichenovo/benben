<!DOCTYPE html>
<html lang="zh">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>吻の歌单</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:#f7f3f2;

    overflow:auto;

    font-family:
    "Times New Roman",
    "STSong",
    serif;
}

/* 背景 */

body::before{

    content:"";

    position:fixed;

    inset:18px;

    border-radius:38px;


    background:

    radial-gradient(
    circle at top left,
    rgba(255,233,241,0.9),
    transparent 28%
    ),

    radial-gradient(
    circle at bottom center,
    rgba(232,228,255,0.78),
    transparent 35%
    ),

    radial-gradient(
    circle at right top,
    rgba(255,255,255,0.7),
    transparent 30%
    ),

    #f7f2f2;

    border:2px solid rgba(255,255,255,0.55);

    z-index:-1;

    pointer-events:none;

    box-shadow:
    inset 0 0 120px rgba(255,255,255,0.45);
}

/* desktop */

.desktop{

    min-width:2200px;
    min-height:1800px;
}

/* mobile */

.mobile{

    min-width:100vw;
    min-height:100vh;

    overflow-x:hidden;
}

/* header */

.header{

    position:fixed;

    z-index:999;
}

/* title */

.title{

    font-weight:500;

    color:#8f7e82;

    letter-spacing:2px;

    font-style:italic;

    line-height:1;

    font-family:
    "Times New Roman",
    "Kaiti SC",
    serif;
}

/* search */

.search-box{

    border:none;

    outline:none;

    background:
    rgba(255,255,255,0.55);

    backdrop-filter:blur(10px);

    color:#a39296;

    transition:0.3s;
}

.search-box::placeholder{

    color:#c8bcc0;
}

/* volume */

.volume-wrap{

    display:flex;

    align-items:center;

    gap:10px;

    margin-top:14px;

    opacity:0.7;

    transition:0.3s;
}

.volume-wrap:hover{

    opacity:1;
}

.volume-icon{

    color:#c5b1be;

    font-size:13px;

    font-style:italic;
}

/* 电脑版 volume */

.volume-slider{

    width:160px;

    height:6px;

    appearance:none;

    background:
    rgba(255,255,255,0.42);

    border-radius:999px;

    outline:none;
}

.volume-slider::-webkit-slider-runnable-track{

    height:6px;

    background:
    rgba(255,255,255,0.36);

    border-radius:999px;
}

.volume-slider::-webkit-slider-thumb{

    appearance:none;

    width:16px;
    height:16px;

    border-radius:50%;

    background:#fffdfd;

    border:2px solid rgba(228,210,230,0.95);

    margin-top:-5px;

    box-shadow:
    0 0 14px rgba(255,255,255,0.9),
    0 0 20px rgba(214,188,210,0.45);
}

/* tip */

.tip{

    position:fixed;

    color:#a39296;

    font-style:italic;

    z-index:999;
}

/* song area */

.song-area{

    position:relative;

    perspective:1200px;

    overflow:hidden;
}

/* songs */

.song{

    position:absolute;

    cursor:pointer;

    pointer-events:auto;

    -webkit-transform:translateZ(0);

    will-change:transform;

    white-space:nowrap;

    transition:
    transform 0.35s ease,
    opacity 0.35s ease,
    color 0.35s ease,
    filter 0.35s ease;

    --fadeOpacity:1;

    opacity:calc(var(--fadeOpacity) * 0.75);

    font-style:italic;

    font-family:
    "Times New Roman",
    "STSong",
    serif;

    animation:
    floatDepth linear infinite;
}

.song:hover{

    transform:
    scale(1.55)
    translateY(-12px)
    translateZ(180px);

    color:#f1d9ff;

    opacity:1;

    z-index:9999;

    text-shadow:

    0 0 12px rgba(255,255,255,1),

    0 0 30px rgba(232,190,255,1),

    0 0 60px rgba(214,170,255,0.95),

    0 0 120px rgba(214,170,255,0.55);
}

/* size */

.small{
    opacity:0.34;
}

.medium{
    opacity:0.55;
}

.large{
    opacity:0.72;
}

/* colors */

.song:nth-child(7n+1){
    color:#b59dcf;
}

.song:nth-child(7n+2){
    color:#95a9c7;
}

.song:nth-child(7n+3){
    color:#b7a3b5;
}

.song:nth-child(7n+4){
    color:#c2a7d8;
}

.song:nth-child(7n+5){
    color:#9c8f97;
}

.song:nth-child(7n+6){
    color:#b0a0be;
}

.song:nth-child(7n){
    color:#8ea0b7;
}

/* floating */

@keyframes floatDepth{

    0%{

        transform:
        translateZ(0px)
        translateY(0px);

        opacity:0.45;
    }

    50%{

        transform:
        translateZ(120px)
        translateY(-20px);

        opacity:0.9;
    }

    100%{

        transform:
        translateZ(0px)
        translateY(0px);

        opacity:0.45;
    }
}

/* notes */

.note{

    position:absolute;

    color:#eadfff;

    pointer-events:none;

    animation:
    musicMove linear infinite;
}

@keyframes musicMove{

    0%{

        transform:
        translate3d(0,300px,-400px)
        scale(0.2);

        opacity:0;
    }

    20%{
        opacity:0.18;
    }

    50%{

        transform:
        translate3d(0,0px,0px)
        scale(1);

        opacity:0.4;
    }

    100%{

        transform:
        translate3d(0,-500px,300px)
        scale(1.9);

        opacity:0;
    }
}

/* desktop */

.desktop .header{

    top:58px;
    left:68px;
}

.desktop .title{

    font-size:84px;
}

.desktop .search-box{

    margin-top:20px;

    width:250px;
    height:42px;

    border-radius:30px;

    padding-left:22px;

    font-size:20px;
}

.desktop .tip{

    top:88px;
    right:105px;

    font-size:24px;
}

.desktop .song-area{

    width:2200px;
    height:1800px;
}

.desktop .small{

    font-size:18px;
}

.desktop .medium{

    font-size:30px;
}

.desktop .large{

    font-size:46px;
}

/* menu button */

.menu-btn{

    position:fixed;

    top:34px;
    right:28px;

    z-index:1000000;

    width:46px;
    height:46px;

    border-radius:18px;

    background:
    rgba(255,255,255,0.5);

    backdrop-filter:blur(12px);

    display:flex;

    align-items:center;
    justify-content:center;

    color:#a78f96;

    font-size:26px;

    cursor:pointer;

    transition:0.3s;
}

.menu-btn:hover{

    transform:scale(1.08);

    background:
    rgba(255,255,255,0.7);
}

/* side menu */

.side-menu{

    position:fixed;

    width:280px;
    height:310px;
    
    top:110px;
    right:-320px;
    
    border-radius:34px 0 0 34px;
    
    background:
    rgba(255,248,252,0.58);
    backdrop-filter:blur(24px);
    
    border:
    1px solid rgba(255,255,255,0.35);
    
    box-shadow:
    0 10px 40px rgba(220,190,210,0.18);
    
    padding-top:18px;

    backdrop-filter:blur(24px);

    z-index:99999;


    transition:0.5s ease;

    box-shadow:
    -10px 0 40px rgba(0,0,0,0.06);
}

.side-menu.show{

    right:28px;
}

/* 手机 */

.mobile .side-menu.show{

    right:14px;
}

/* menu item */

.menu-item{

    padding:
    18px 24px;

    font-size:17px;

    color:#a88f98;

    font-style:italic;

    cursor:pointer;

    transition:0.3s;
}

.menu-item:hover{

    color:#d3a7bf;

    transform:translateX(6px);
}

/* mobile */

.mobile .side-menu{

    width:240px;

    height:240px;

    right:-260px;

    top:88px;


    border-radius:26px 0 0 26px;

    padding-top:8px;

    padding-bottom:8px;
}

.mobile .menu-item{

    font-size:15px;

    padding:
    11px 22px;
}

.mobile .menu-btn{

    top:24px;
    right:20px;

    width:42px;
    height:42px;

    font-size:22px;
}

/* mobile */

.mobile::before{

    inset:10px;

    border-radius:24px;
}

.mobile .header{

    top:28px;
    left:24px;
}

.mobile .title{

    font-size:42px;

    line-height:1.1;
}

.mobile .search-box{

    margin-top:14px;

    width:180px;
    height:34px;

    border-radius:20px;

    padding-left:16px;

    font-size:15px;
}

.mobile .tip{

    top:108px;
    right:22px;

    font-size:12px;
}

.mobile .song-area{

    width:94vw;
    height:1800px;
}

.mobile .small{

    font-size:14px;
}

.mobile .medium{

    font-size:22px;
}

.mobile .large{

    font-size:29px;
}

.mobile .song:hover{

    transform:none;

    text-shadow:none;
}

.mobile .song:active{

    transform:scale(1.3);

    color:#f1d9ff;
}

/* 手机版竖着音量 */

.mobile .volume-wrap{

    margin-top:14px;

    display:flex;

    align-items:center;

    gap:10px;

    opacity:0.9;
}

.mobile .volume-icon{

    color:#ccb6c4;

    font-size:14px;
}

.mobile .volume-slider{

    width:118px;

    height:6px;

    appearance:none;

    background:
    rgba(255,255,255,0.38);

    border-radius:999px;

    outline:none;

    box-shadow:

    0 0 10px rgba(255,255,255,0.22),

    inset 0 0 4px rgba(255,255,255,0.45);
}

.mobile .volume-slider::-webkit-slider-runnable-track{

    height:6px;

    background:
    rgba(255,255,255,0.32);

    border-radius:999px;
}

.mobile .volume-slider::-webkit-slider-thumb{

    -webkit-appearance:none;

    appearance:none;

    width:11px;
    height:11px;

    border-radius:50%;

    background:#fffdfd;

    border:2px solid rgba(228,210,230,0.9);

    margin-top:-3.5px;

    box-shadow:

    0 0 14px rgba(255,255,255,0.9),

    0 0 20px rgba(214,188,210,0.45);
}

/* enter page */

.enter-page{

    position:fixed;

    inset:0;

    z-index:999999;

    display:flex;

    align-items:center;

    justify-content:center;

    background:

    radial-gradient(
    circle at top left,
    rgba(255,228,238,0.95),
    transparent 30%
    ),

    radial-gradient(
    circle at bottom right,
    rgba(238,228,255,0.9),
    transparent 35%
    ),

    #f8f0f3;

    backdrop-filter:blur(10px);

    transition:
    opacity 1.2s ease,
    visibility 1.2s ease;
}

.enter-page.hide{

    opacity:0;

    visibility:hidden;

    pointer-events:none;
}

.enter-content{

    text-align:center;
}

.enter-title{

    color:#a58b92;

    font-size:82px;

    letter-spacing:4px;

    font-style:italic;

    font-family:
    "Times New Roman",
    "Kaiti SC",
    serif;

    text-shadow:
    0 0 25px rgba(255,255,255,0.7);
}

.enter-sub{

    margin-top:28px;

    color:#c8aeb8;

    font-size:24px;

    letter-spacing:5px;

    font-style:italic;

    opacity:0.88;
}

.enter-arrow{

    margin-top:18px;

    color:#d8bcc8;

    font-size:30px;

    animation:
    arrowMove 1.8s infinite;
}

@keyframes arrowMove{

    0%{
        transform:translateX(0px);
        opacity:0.4;
    }

    50%{
        transform:translateX(10px);
        opacity:1;
    }

    100%{
        transform:translateX(0px);
        opacity:0.4;
    }
}

/* mobile */

.mobile .enter-title{

    font-size:44px;

    line-height:1.3;
}

.mobile .enter-sub{

    font-size:14px;

    letter-spacing:3px;
}

.mobile .enter-arrow{

    font-size:24px;
}

.menu-line{

    width:78%;

    height:1px;

    background:
    rgba(236,180,210,0.45);

    margin:auto;

    margin-top:6px;
    margin-bottom:6px;
}

.menu-overlay{

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100vh;

    background:
    rgba(255,245,250,0.42);

    backdrop-filter:blur(3px);

    opacity:0;

    pointer-events:none;

    transition:0.4s;

    z-index:9998;
}

.menu-overlay.show{

    opacity:1;

    pointer-events:auto;
}

</style>

</head>

<body id="body">

<audio id="bgm" loop preload="auto">

    <source src="bgm.mp3" type="audio/mpeg">

</audio>

<div class="header">

    <div class="title">

    </div>

    <div class="menu-btn" id="menuBtn">
        ☰
    </div>

    <input
    class="search-box"
    id="searchInput"
    placeholder="试试搜索">

    <div class="volume-wrap">

        <span class="volume-icon">
        ♫
        </span>

        <input
        type="range"
        min="0"
        max="100"
        value="4"

        id="volumeSlider">

</div>

<div class="enter-page" id="enterPage">

        </div>

        onclick="enterSite()">

</div>

class="menu-overlay"
id="menuOverlay">
</div>

    class="menu-item"

    </div>

    class="menu-item"
    onclick="window.location.href='wwti.html'">

    </div>

    <div
    class="menu-item"
    onclick="window.location.href='message.html'">

        写给吻的话

    </div>

    <div class="menu-line"></div>

    <div 
    class="menu-item"
    onclick="window.location.href='words.html'">

        吻的有话想说

    </div>

</div>


    <div class="menu-line"></div>


<div class="tip">
    点击歌名试试～
</div>

<div class="song-area" id="songArea"></div>

<script>

/* enter page */

const enterPage =
document.getElementById("enterPage");

const params =
new URLSearchParams(window.location.search);




/* background music */

const bgm =
document.getElementById("bgm");

bgm.volume = 0.38;

if(params.get("entered")==="true"){

    enterPage.classList.add("hide");

    const savedTime =
    localStorage.getItem("bgmTime");

    if(savedTime){

        bgm.currentTime =
        parseFloat(savedTime);
    }

    /* Safari 允许：因为是点击返回触发 */

    setTimeout(()=>{

        bgm.play();

    },100);
}

/* 恢复播放状态 */

const savedTime =
localStorage.getItem("bgmTime");

if(savedTime){

    bgm.currentTime =
    parseFloat(savedTime);
}

const shouldPlay =
localStorage.getItem("bgmPlaying");

if(
shouldPlay === "true"
||

params.get("resume")==="true"
){

    bgm.play();
}

const volumeSlider =
document.getElementById("volumeSlider");

volumeSlider.addEventListener(

"input",

()=>{

    bgm.volume =
    volumeSlider.value / 100;
}
);

if(savedTime){

    bgm.currentTime =
    parseFloat(savedTime);
}

async function startMusic(){

    try{

        await bgm.play();

    }catch(e){

        console.log("autoplay blocked");
    }
}


bgm.addEventListener(

"timeupdate",

()=>{

    localStorage.setItem(
    "bgmTime",
    bgm.currentTime
    );

});


/* device detect */

const isMobile =
window.innerWidth <= 768;

if(isMobile){

    document.body.classList.add("mobile");

}else{

    document.body.classList.add("desktop");
}

/* songs */

const songs = [

"末日","走马","天赋","空空","半壶纱",
"要爱我","失眠了","小公主","after17",
"野火一季","心愿便利贴","梁山伯与茱丽叶",
"Always Online","你的crush降临了吗",
"绿色","爱我你就抱抱我","那时雨",
"东京不太热","一滴泪的时间",
"夏天的风","怪我咯","虚拟","宠坏",
"不要忘记我爱你","树的花语",
"奇妙能力歌","左手右手",
"天龙八部之宿敌","南泥湾",
"越来越不懂","公主殿下","宝贝",
"有雨有雨","粉雾海","宠爱",
"红昭愿","Doll","日不落","怎么了",
"我们","关键词",
"怪物","第57次取消发送",
"凑热闹","嗯哼","不怕", "让风告诉你",
"如果爱忘了","摆","来不及",
"几分之几","take me hand"

];

const songArea =
document.getElementById("songArea");

songs.forEach(songName=>{

    const song =
    document.createElement("div");

    const random =
    Math.random();

    let sizeClass = "small";

    if(random > 0.7){
        sizeClass = "medium";
    }

    if(random > 0.92){
        sizeClass = "large";
    }

    song.className =
    "song " + sizeClass;

    song.innerText =
    songName;

    let x;
let y;

let tries = 0;

let overlapCount = 0;

do{

    if(isMobile){

        x =
        45 + Math.random()*240;

        y =
        220 + Math.random()*1350;

    }else{

        x =
            80 + Math.random()*1900;

        y =
            180 + Math.random()*1400;
    }

    tries++;

    overlapCount = 0;

    document.querySelectorAll(".song").forEach(existing=>{

        const ex =
        parseFloat(existing.style.left);

        const ey =
        parseFloat(existing.style.top);

        const dx =
        Math.abs(ex - x);

        const dy =
        Math.abs(ey - y);

        if(dx < 98 && dy < 60){

            overlapCount++;
        }
    });

}while(tries < 30 && overlapCount > 2);

       

    song.style.left =
    x + "px";

    song.style.top =
    y + "px";

    /* title区域透明 */

let fade = 1;

if(isMobile){

    if(y < 220){

        fade =
        Math.max(
        0.08,
        (y - 120) / 100
        );
    }

}else{

    if(y < 260){

        fade =
        Math.max(
        0.08,
        (y - 140) / 120
        );
    }
}

song.style.setProperty(
"--fadeOpacity",
fade
);

    song.style.animationDuration =
    10 + Math.random()*8 + "s";

    song.onclick = ()=>{

    localStorage.setItem(
    "bgmTime",
    bgm.currentTime
    );

    localStorage.setItem(
    "bgmPlaying",
    "true"
    );

    window.location.href =
    "song.html?song=" +
    encodeURIComponent(songName);
};

    songArea.appendChild(song);
});

/* search */

/* search */

const searchInput =
document.getElementById("searchInput");

/* 搜索结果框 */

const resultBox =
document.createElement("div");

resultBox.style.position = "fixed";

resultBox.style.top =
(isMobile ? "118px" : "205px");

resultBox.style.left =
(isMobile ? "24px" : "68px");

resultBox.style.width =
(isMobile ? "180px" : "250px");

resultBox.style.maxHeight = "260px";

resultBox.style.overflowY = "auto";

resultBox.style.padding = "8px";

resultBox.style.borderRadius = "22px";

resultBox.style.background =
"rgba(255,255,255,0.55)";

resultBox.style.backdropFilter =
"blur(18px)";

resultBox.style.boxShadow =
"0 10px 30px rgba(220,190,210,0.12)";

resultBox.style.zIndex = "99999";

resultBox.style.display = "none";

document.body.appendChild(resultBox);

/* 高亮函数 */

function highlightText(text, keyword){

    const escaped =
    keyword.replace(
    /[.*+?^${}()|[\]\\]/g,
    '\\$&'
    );

    const regex =
    new RegExp("(" + escaped + ")", "gi");

    return text.replace(

        regex,

        `<span style="
        color:#d9a3ff;
        font-weight:bold;
        text-shadow:
        0 0 8px rgba(255,255,255,0.9);
        ">
        $1
        </span>`
    );
}

/* 输入时实时搜索 */

searchInput.addEventListener(

"input",

function(){

    const value =
    this.value.trim();

    resultBox.innerHTML = "";

    if(value === ""){

        resultBox.style.display =
        "none";

        return;
    }

    const matchedSongs =

    songs.filter(song =>

        song.includes(value)
    );

    if(matchedSongs.length === 0){

        resultBox.style.display =
        "none";

        return;
    }

    resultBox.style.display =
    "block";

    matchedSongs.forEach(songName=>{

        const item =
        document.createElement("div");

        item.style.padding =
        "10px 14px";

        item.style.cursor =
        "pointer";

        item.style.color =
        "#a58f9c";

        item.style.fontStyle =
        "italic";

        item.style.borderRadius =
        "14px";

        item.style.transition =
        "0.25s";

        item.innerHTML =
        highlightText(
        songName,
        value
        );

        item.onmouseenter = ()=>{

            item.style.background =
            "rgba(255,255,255,0.45)";
        };

        item.onmouseleave = ()=>{

            item.style.background =
            "transparent";
        };

        item.onclick = ()=>{

            localStorage.setItem(
            "bgmTime",
            bgm.currentTime
            );

            localStorage.setItem(
            "bgmPlaying",
            "true"
            );

            window.location.href =
            "song.html?song=" +
            encodeURIComponent(songName);
        };

        resultBox.appendChild(item);
    });
});

/* 回车搜索 */

searchInput.addEventListener(

"keypress",

function(e){

    if(e.key === "Enter"){

        const value =
        this.value.trim();

        /* 完全匹配才跳转 */

        if(songs.includes(value)){

            localStorage.setItem(
            "bgmTime",
            bgm.currentTime
            );

            localStorage.setItem(
            "bgmPlaying",
            "true"
            );

            window.location.href =
            "song.html?song=" +
            encodeURIComponent(value);

        }else{

            alert(
            "TuT 窝还没学会《"
            + value +
            "》\n可以告诉我我去学哟"
            );

        /* 清空 */

        this.value = "";

        /* 关闭结果框 */

        resultBox.style.display =
        "none";

        /* 收起键盘 */

        this.blur();
        }
    }
});



/* 点击空白关闭 */

document.addEventListener(

"click",

function(e){

    if(

    !searchInput.contains(e.target)

    &&

    !resultBox.contains(e.target)

    ){

        resultBox.style.display =
        "none";
    }
});

 

/* menu */

const menuBtn =
document.getElementById("menuBtn");

const sideMenu =
document.getElementById("sideMenu");

const menuOverlay =
document.getElementById("menuOverlay");

/* open */

menuBtn.addEventListener(

"click",

()=>{

    sideMenu.classList.add("show");

    menuOverlay.classList.add("show");

}
);

/* close */

menuOverlay.addEventListener(

"click",

()=>{

    sideMenu.classList.remove("show");

    menuOverlay.classList.remove("show");

}
);

/* notes */

let noteCount = 95;

if(isMobile){

    noteCount = 28;
}

for(let i=0;i<noteCount;i++){

    const note =
    document.createElement("div");

    note.className = "note";

    const symbols =
    ["♪","♫","♬","♩","𝄞"];

    note.innerText =
    symbols[
    Math.floor(
    Math.random()*symbols.length
    )];

    if(isMobile){

        note.style.left =
        Math.random()*100 + "vw";

        note.style.top =
        Math.random()*1800 + "px";

    }else{

        note.style.left =
        Math.random()*2200 + "px";

        note.style.top =
        Math.random()*1900 + "px";
    }

    note.style.fontSize =
    16 + Math.random()*55 + "px";

    note.style.animationDuration =
    8 + Math.random()*8 + "s";

    songArea.appendChild(note);
}
