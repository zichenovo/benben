<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>笨笨的の歌单</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Noto+Serif+SC:wght@300;400&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    overflow:auto;

    width:100vw;
    height:100vh;

    background:
    radial-gradient(circle at center,
    rgba(236,230,255,0.7),
    rgba(250,245,248,1) 70%);

    font-family:
    'Cormorant Garamond',
    'Noto Serif SC',
    serif;
}

.world{

    position:relative;

    width:2400px;
    height:1800px;

    overflow:hidden;

    animation:
    bgBreath 12s ease-in-out infinite alternate;
}

@keyframes bgBreath{

    from{
        transform:scale(1);
    }

    to{
        transform:scale(1.03);
    }
}

.title{

    position:fixed;

    top:55px;
    left:60px;

    z-index:50;

    font-size:78px;

    font-weight:300;

    color:#9d8c95;

    font-style:italic;

    letter-spacing:2px;
}

.search{

    position:fixed;

    top:170px;
    left:60px;

    z-index:50;
}

.search input{

    width:260px;
    height:52px;

    border:none;
    outline:none;

    border-radius:999px;

    padding:0 24px;

    font-size:18px;

    color:#a1939b;

    background:
    rgba(255,255,255,0.62);

    backdrop-filter:blur(10px);

    box-shadow:
    0 0 30px rgba(255,255,255,0.6);

    font-family:
    'Noto Serif SC',
    serif;
}

.tip{

    position:fixed;

    top:120px;
    right:80px;

    color:#d3b9ff;

    font-size:28px;

    font-style:italic;

    z-index:50;
}

.song{

    position:absolute;

    text-decoration:none;

    font-weight:300;

    white-space:nowrap;

    transition:
    transform .8s ease,
    opacity .8s ease;

    animation:
    floaty ease-in-out infinite alternate;
}

.song:hover{

    transform:
    scale(1.12);

    opacity:1;
}

@keyframes floaty{

    from{
        transform:
        translateY(0px)
        translateX(0px);
    }

    to{
        transform:
        translateY(-18px)
        translateX(8px);
    }
}

.note{

    position:absolute;

    color:#eadfff;

    pointer-events:none;

    animation:
    depthMove linear infinite;
}

@keyframes depthMove{

    0%{

        transform:
        translateZ(-500px)
        scale(0.3);

        opacity:0;
    }

    20%{
        opacity:0.25;
    }

    100%{

        transform:
        translateZ(300px)
        scale(1.8);

        opacity:0;
    }
}

</style>
</head>
<body>

<div class="title">
笨笨的の歌单
</div>

<div class="search">
<input id="searchInput" placeholder="试试搜索">
</div>

<div class="tip">
点击歌名可以试听～
</div>

<div class="world" id="world"></div>

<script>

const songs = [

"东京不太热","怪物","宠坏","如果爱忘了","红色高跟鞋",
"第57次取消发送","爱我你就抱抱我","公主殿下","心愿便利贴",
"一滴泪的时间","Doll","你的crush降临了吗","天赋","有雨有雨",
"空空","半壶纱","我们","南泥湾","粉雾海","AlwaysOnline",
"绿色","怪我咯","左手右手","凑热闹","野火一季","红昭愿",
"宝贝","after17","梁山伯与朱丽叶","宠爱","失眠了",
"奇妙能力歌","夏天的风","走马","怎么了","末日不落",
"天龙八部之宿敌","不要忘记我爱你","几分之几","take me hand"

];

const colors = [

"#cfa9ff",
"#a8c3ff",
"#d7b2ff",
"#b3b0c8",
"#cbb6d9",
"#adc7ff",
"#caa2ff",
"#c9b8d0"

];

const world = document.getElementById("world");

songs.forEach(song=>{

    const a=document.createElement("a");

    a.className="song";

    a.innerText=song;

    a.href="song.html?song="+encodeURIComponent(song);

    a.style.left=
    Math.random()*2100+"px";

    a.style.top=
    Math.random()*1500+"px";

    a.style.fontSize=
    (22+Math.random()*42)+"px";

    a.style.color=
    colors[Math.floor(Math.random()*colors.length)];

    a.style.opacity=
    0.45+Math.random()*0.4;

    a.style.animationDuration=
    (4+Math.random()*8)+"s";

    world.appendChild(a);
});

const symbols=["♫","♪","♬","♩"];

for(let i=0;i<70;i++){

    const note=document.createElement("div");

    note.className="note";

    note.innerHTML=
    symbols[Math.floor(Math.random()*symbols.length)];

    note.style.left=
    Math.random()*2400+"px";

    note.style.top=
    Math.random()*1800+"px";

    note.style.fontSize=
    (16+Math.random()*50)+"px";

    note.style.animationDuration=
    (3+Math.random()*6)+"s";

    note.style.animationDelay=
    (-Math.random()*10)+"s";

    note.style.opacity=
    Math.random()*0.25;

    world.appendChild(note);
}

document
.getElementById("searchInput")
.addEventListener("keypress",function(e){

    if(e.key==="Enter"){

        const value=this.value.trim();

        if(songs.includes(value)){

            window.location.href=
            "song.html?song="+encodeURIComponent(value);

        }else{

            alert(
            "不好意思 笨笨的还没学会这首歌～"
            );
        }
    }
});

</script>

</body>
</html>
