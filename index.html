<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>笨笨的の歌单</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{

    width:100%;
    height:100%;

    overflow:auto;

    font-family:
    "Times New Roman",
    "STSong",
    serif;
}

/* 整体背景 */

body{

    min-width:2200px;
    min-height:1600px;

    background:
    radial-gradient(circle at center,
    #f8edf4 0%,
    #f6f1f7 30%,
    #f1f3fa 70%,
    #edf3ff 100%);

    position:relative;
}

/* 边界 */

.main{

    position:relative;

    width:2100px;
    height:1500px;

    margin:30px;

    border-radius:42px;

    overflow:visible;

    perspective:1400px;

    border:1px solid rgba(255,255,255,0.55);

    box-shadow:
    inset 0 0 100px rgba(255,255,255,0.3);
}

/* 柔光 */

.glow{

    position:absolute;

    width:900px;
    height:900px;

    border-radius:50%;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    background:
    radial-gradient(circle,
    rgba(236,222,255,0.32),
    transparent 72%);

    pointer-events:none;
}

/* 标题 */

.title{

    position:absolute;

    left:60px;
    top:42px;

    font-size:78px;

    color:#917f87;

    font-style:italic;

    font-weight:500;

    z-index:50;
}

/* 搜索框 */

.search{

    position:absolute;

    left:60px;
    top:170px;

    width:300px;
    height:52px;

    border:none;

    outline:none;

    border-radius:999px;

    background:
    rgba(255,255,255,0.62);

    backdrop-filter:blur(10px);

    padding-left:26px;

    font-size:18px;

    color:#9a8c92;

    box-shadow:
    0 10px 30px rgba(255,255,255,0.26);

    z-index:50;
}

.search::placeholder{

    color:#bcaeb6;
}

/* 右上角 */

.tip{

    position:absolute;

    top:76px;
    right:80px;

    font-size:20px;

    color:#d0b7ff;

    font-style:italic;

    letter-spacing:1px;
}

/* 歌名 */

.song{

    position:absolute;

    text-decoration:none;

    font-style:italic;

    font-weight:500;

    white-space:nowrap;

    transition:
    transform 0.8s ease,
    opacity 0.8s ease,
    filter 0.8s ease;

    animation:
    floaty 7s ease-in-out infinite;

    transform-origin:center;
}

/* hover */

.song:hover{

    transform:
    scale(1.25)
    translateZ(80px);

    z-index:999;

    filter:blur(0px);
}

/* 浮动 */

@keyframes floaty{

    0%{

        transform:
        translateY(0px)
        translateX(0px);
    }

    25%{

        transform:
        translateY(-8px)
        translateX(5px);
    }

    50%{

        transform:
        translateY(-14px)
        translateX(-6px);
    }

    75%{

        transform:
        translateY(-5px)
        translateX(4px);
    }

    100%{

        transform:
        translateY(0px)
        translateX(0px);
    }
}

/* 字体大小 */

.s1{font-size:26px;}
.s2{font-size:34px;}
.s3{font-size:44px;}
.s4{font-size:52px;}

/* 颜色 */

.c1{color:#b39adf;}
.c2{color:#9fb3dc;}
.c3{color:#d0b4cf;}
.c4{color:#b7a6b6;}
.c5{color:#cab1eb;}
.c6{color:#aebee5;}

/* 音符 */

.music-note{

    position:absolute;

    color:rgba(212,194,255,0.22);

    pointer-events:none;

    user-select:none;

    font-size:34px;

    animation:
    depthFloat linear infinite;
}

/* 纵深动画 */

@keyframes depthFloat{

    0%{

        transform:
        translateZ(-400px)
        scale(0.2);

        opacity:0;

        filter:blur(4px);
    }

    50%{

        transform:
        translateZ(0px)
        scale(1);

        opacity:0.25;

        filter:blur(0px);
    }

    100%{

        transform:
        translateZ(300px)
        scale(1.8);

        opacity:0;

        filter:blur(5px);
    }
}

/* 音符位置 */

.note1{
    left:8%;
    top:18%;
    animation-duration:18s;
}

.note2{
    left:20%;
    top:72%;
    animation-duration:24s;
}

.note3{
    left:38%;
    top:28%;
    animation-duration:20s;
}

.note4{
    left:52%;
    top:82%;
    animation-duration:26s;
}

.note5{
    left:63%;
    top:14%;
    animation-duration:22s;
}

.note6{
    left:74%;
    top:64%;
    animation-duration:19s;
}

.note7{
    left:86%;
    top:32%;
    animation-duration:27s;
}

.note8{
    left:92%;
    top:78%;
    animation-duration:21s;
}

</style>
</head>

<body>

<div class="main">

    <!-- 歌名 -->

    <a class="song c1 s4" style="left:10%;top:26%;" href="song.html?song=你的crush降临了吗">你的crush降临了吗</a>

    <a class="song c2 s3" style="left:58%;top:64%;" href="song.html?song=宠坏">宠坏</a>

</div>

<script>

const songs = [

"末日","走马","天赋","空空","半壶纱",
"要爱我","失眠了","小公主","after17",
"野火一季","心愿便利贴","梁山伯与朱丽叶",
"AlwaysOnline","你的crush降临了吗","绿色",
"爱我你就抱抱我","那时雨","东京不太热",
"一滴泪的时间","夏天的风","怪我咯","虚拟",
"宠坏","不要忘记我爱你","树的花语",
"奇妙能力歌","左手右手","天龙八部之宿敌",
"南泥湾","越来越不懂","公主殿下","宝贝",
"有雨有雨","粉雾海","宠爱","红昭愿",
"等","Doll","日不落","怎么了","我们",
"红色高跟鞋","关键词","怪物",
"第57次取消发送","凑热闹","嗯哼",
"不怕","如果爱忘了","摆","几分之几",
"take me hand"

];

document
.getElementById("searchInput")
.addEventListener("keypress",function(e){

    if(e.key==="Enter"){

        const value =
        this.value.trim();

        if(songs.includes(value)){

            window.location.href =
            "song.html?song=" +
            encodeURIComponent(value);

        }else{

            alert(
            "不好意思 笨笨的还没学会 已加入待学歌单～"
            );
        }
    }
});

</script>

</body>
</html>
