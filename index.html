<!DOCTYPE html>
<html lang="zh">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>笨笨的の歌单</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    margin:0;

    background:#f7f2f2;

    overflow:auto;

    font-family:
    "Times New Roman",
    "STSong",
    serif;

    color:#8f7f84;

    min-width:2400px;
    min-height:1900px;
}

/* 柔和边框 */

body::before{

    content:"";

    position:fixed;

    inset:18px;

    border-radius:38px;

    border:2px solid rgba(255,255,255,0.55);

    pointer-events:none;

    z-index:-1;

    background:

    radial-gradient(
    circle at top left,
    rgba(255,232,240,0.9) 0%,
    transparent 30%
    ),

    radial-gradient(
    circle at bottom center,
    rgba(231,227,255,0.75) 0%,
    transparent 35%
    ),

    radial-gradient(
    circle at right top,
    rgba(255,255,255,0.7) 0%,
    transparent 40%
    ),

    #f6f1f0;

    box-shadow:

    inset 0 0 120px rgba(255,255,255,0.5),

    0 0 30px rgba(220,210,220,0.2);
}

/* 左上 */

.header{

    position:fixed;

    top:55px;
    left:65px;

    z-index:999;
}

.title{

    font-size:92px;

    font-weight:700;

    color:#8d7d7b;

    letter-spacing:2px;
}

/* 搜索 */

.search-box{

    margin-top:24px;

    width:380px;
    height:62px;

    border:none;

    border-radius:40px;

    padding-left:30px;

    font-size:30px;

    background:rgba(255,255,255,0.62);

    backdrop-filter:blur(12px);

    outline:none;

    color:#9b8f92;

    box-shadow:
    0 8px 30px rgba(0,0,0,0.04);
}

/* 右上 */

.tip{

    position:fixed;

    top:85px;
    right:110px;

    font-size:25px;

    color:#c7b1ea;

    letter-spacing:2px;

    font-style:italic;

    opacity:0.9;

    z-index:999;
}

/* 整体区域 */

.song-area{

    position:relative;

    width:2400px;
    height:1900px;

    overflow:hidden;
}

/* 歌名 */

.song{

    position:absolute;

    cursor:pointer;

    transition:
    transform 0.45s ease,
    color 0.45s ease,
    opacity 0.45s ease;

    user-select:none;

    white-space:nowrap;

    mix-blend-mode:multiply;

    font-style:italic;

    animation:
    floaty ease-in-out infinite;
}

/* 和谐颜色 */

.song:nth-child(7n+1){
    color:#a98bc7;
}

.song:nth-child(7n+2){
    color:#8fa7c9;
}

.song:nth-child(7n+3){
    color:#b49ab7;
}

.song:nth-child(7n+4){
    color:#9e8fa1;
}

.song:nth-child(7n+5){
    color:#c4a0d8;
}

.song:nth-child(7n+6){
    color:#8ea1b8;
}

.song:nth-child(7n){
    color:#b7a2b0;
}

/* hover */

.song:hover{

    color:#c084fc;

    transform:
    scale(1.08)
    translateY(-4px);

    opacity:1;

    z-index:99;
}

/* 字体大小 */
/* 已经限制最大字体 */

.small{

    font-size:22px;
    opacity:0.4;
}

.medium{

    font-size:40px;
    opacity:0.65;
}

.large{

    font-size:58px;
    opacity:0.82;
}

/* 漂浮 */

.song:nth-child(odd){

    animation-duration:9s;
}

.song:nth-child(even){

    animation-duration:13s;
}

@keyframes floaty{

    0%{
        transform:
        translateY(0px)
        translateX(0px);
    }

    25%{
        transform:
        translateY(-10px)
        translateX(7px);
    }

    50%{
        transform:
        translateY(6px)
        translateX(-8px);
    }

    75%{
        transform:
        translateY(-7px)
        translateX(5px);
    }

    100%{
        transform:
        translateY(0px)
        translateX(0px);
    }
}

/* 音符 */

.note{

    position:absolute;

    color:#e4d8ff;

    opacity:0.35;

    pointer-events:none;

    animation:
    drift linear infinite;
}

@keyframes drift{

    from{

        transform:
        translateY(0px)
        translateX(0px)
        rotate(0deg);
    }

    to{

        transform:
        translateY(-140px)
        translateX(50px)
        rotate(18deg);
    }
}

</style>
</head>

<body>

<div class="header">

    <div class="title">
        笨笨的の歌单
    </div>

    <input
    class="search-box"
    id="searchInput"
    placeholder="试试搜索">

</div>

<div class="tip">
    点击歌名可以试听～
</div>

<div class="song-area" id="songArea"></div>

<script>

const songs = [

"末日",
"走马",
"天赋",
"空空",
"半壶纱",
"要爱我",
"失眠了",
"小公主",
"after17",
"野火一季",
"心愿便利贴",
"梁山伯与朱丽叶",
"AlwaysOnline",
"你的crush降临了吗",
"绿色",
"爱我你就抱抱我",
"那时雨",
"东京不太热",
"一滴泪的时间",
"夏天的风",
"怪我咯",
"虚拟",
"宠坏",
"不要忘记我爱你",
"树的花语",
"奇妙能力歌",
"左手右手",
"天龙八部之宿敌",
"南泥湾",
"越来越不懂",
"公主殿下",
"宝贝",
"有雨有雨",
"粉雾海",
"宠爱",
"红昭愿",
"Doll",
"日不落",
"怎么了",
"我们",
"红色高跟鞋",
"关键词",
"怪物",
"第57次取消发送",
"凑热闹",
"嗯哼",
"不怕",
"如果爱忘了",
"摆",
"几分之几",
"take me hand"

];

const songArea =
document.getElementById("songArea");

/* 歌名 */

songs.forEach(songName=>{

    const song =
    document.createElement("div");

    const sizes =
    ["small","medium","large"];

    /* large概率减少 */

    const randomIndex =
    Math.random() < 0.15
    ? 2
    : Math.random() < 0.5
    ? 1
    : 0;

    const randomSize =
    sizes[randomIndex];

    song.className =
    "song " + randomSize;

    song.innerText =
    songName;

    const x =
    120 + Math.random()*2000;

    const y =
    180 + Math.random()*1500;

    song.style.left =
    x + "px";

    song.style.top =
    y + "px";

    song.onclick = ()=>{

        window.location.href =
        "song.html?song=" +
        encodeURIComponent(songName);
    };

    songArea.appendChild(song);
});

/* 搜索 */

document
.getElementById("searchInput")
.addEventListener("keypress",function(e){

    if(e.key==="Enter"){

        const value =
        this.value.trim();

        if(songs.includes(value)){

            window.location.href =
            "song.html?song=" +
            encodeURIComponent(value);

        }else{

            alert(
            "不好意思 笨笨的还没学会《"
            + value +
            "》 已加入待学歌单～"
            );
        }
    }
});

/* 音符 */

for(let i=0;i<55;i++){

    const note =
    document.createElement("div");

    note.className = "note";

    const symbols =
    ["♪","♫","♬","♩","𝄞"];

    note.innerText =
    symbols[
    Math.floor(
    Math.random()*symbols.length
    )];

    note.style.left =
    Math.random()*2400 + "px";

    note.style.top =
    Math.random()*1900 + "px";

    note.style.fontSize =
    18 + Math.random()*50 + "px";

    note.style.animationDuration =
    12 + Math.random()*20 + "s";

    songArea.appendChild(note);
}

</script>

</body>
</html>
