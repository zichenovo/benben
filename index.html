<!DOCTYPE html>
<html lang="zh">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>笨笨的の歌单</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:#f7f3f2;

    overflow:auto;

    font-family:
    "Times New Roman",
    "STSong",
    serif;

    min-width:2200px;
    min-height:1800px;
}

/* 背景 */

body::before{

    content:"";

    position:fixed;

    inset:18px;

    border-radius:38px;

    background:

    radial-gradient(
    circle at top left,
    rgba(255,233,241,0.9),
    transparent 28%
    ),

    radial-gradient(
    circle at bottom center,
    rgba(232,228,255,0.78),
    transparent 35%
    ),

    radial-gradient(
    circle at right top,
    rgba(255,255,255,0.7),
    transparent 30%
    ),

    #f7f2f2;

    border:2px solid rgba(255,255,255,0.55);

    z-index:-1;

    pointer-events:none;

    box-shadow:
    inset 0 0 120px rgba(255,255,255,0.45);
}

/* 左上 */

.header{

    position:fixed;

    top:58px;
    left:68px;

    z-index:999;
}

/* 标题 */

.title{

    font-size:84px;

    font-weight:500;

    color:#8f7e82;

    letter-spacing:2px;

    font-style:italic;

    line-height:1;

    font-family:
    "Times New Roman",
    "Kaiti SC",
    serif;
}

/* 搜索框 */
/* 更细 更小 */

.search-box{

    margin-top:20px;

    width:250px;
    height:42px;

    border:none;

    border-radius:30px;

    padding-left:22px;

    font-size:20px;

    font-style:italic;

    background:rgba(255,255,255,0.55);

    backdrop-filter:blur(10px);

    outline:none;

    color:#a39296;

    box-shadow:
    0 4px 18px rgba(0,0,0,0.03);

    transition:0.3s;
}

.search-box::placeholder{

    color:#c8bcc0;
}

.search-box:focus{

    background:rgba(255,255,255,0.72);
}

/* 右上 */

.tip{

    position:fixed;

    top:88px;
    right:105px;

    font-size:24px;

    color:#c8afe9;

    letter-spacing:2px;

    font-style:italic;

    z-index:999;
}

/* 区域 */

.song-area{

    position:relative;

    width:2200px;
    height:1800px;

    perspective:1200px;

    overflow:hidden;
}

/* 歌名 */

.song{

    position:absolute;

    cursor:pointer;

    white-space:nowrap;

    transition:
    transform 0.35s ease,
    opacity 0.35s ease,
    color 0.35s ease;

    font-style:italic;

    font-family:
    "Times New Roman",
    "STSong",
    serif;

    animation:
    floatDepth linear infinite;

    filter:blur(0.2px);

    mix-blend-mode:screen;
}

/* hover */

.song:hover{

    transform:
    scale(1.55)
    translateY(-12px)
    translateZ(180px);

    color:#f1d9ff;

    opacity:1;

    z-index:9999;

    text-shadow:

    0 0 12px rgba(255,255,255,1),

    0 0 30px rgba(232,190,255,1),

    0 0 60px rgba(214,170,255,0.95),

    0 0 120px rgba(214,170,255,0.55);

    filter:

    blur(0px)

    brightness(1.25);
}

/* 大小 */

.small{

    font-size:18px;
    opacity:0.34;
}

.medium{

    font-size:30px;
    opacity:0.55;
}

.large{

    font-size:46px;
    opacity:0.72;
}

/* 配色 */

.song:nth-child(7n+1){
    color:#b59dcf;
}

.song:nth-child(7n+2){
    color:#95a9c7;
}

.song:nth-child(7n+3){
    color:#b7a3b5;
}

.song:nth-child(7n+4){
    color:#c2a7d8;
}

.song:nth-child(7n+5){
    color:#9c8f97;
}

.song:nth-child(7n+6){
    color:#b0a0be;
}

.song:nth-child(7n){
    color:#8ea0b7;
}

/* 纵深漂浮 */

@keyframes floatDepth{

    0%{

        transform:
        translateZ(0px)
        translateY(0px);

        opacity:0.45;
    }

    50%{

        transform:
        translateZ(120px)
        translateY(-20px);

        opacity:0.9;
    }

    100%{

        transform:
        translateZ(0px)
        translateY(0px);

        opacity:0.45;
    }
}

/* 音符 */

.note{

    position:absolute;

    color:#eadfff;

    opacity:0.32;

    pointer-events:none;

    animation:
    musicMove linear infinite;
    filter:blur(1px);
}

/* 更有纵深感 */

@keyframes musicMove{

    0%{

        transform:
        translate3d(0,300px,-400px)
        scale(0.2);

        opacity:0;
    }

    20%{

        opacity:0.18;
    }

    50%{

        transform:
        translate3d(0,0px,0px)
        scale(1);

        opacity:0.4;
    }

    100%{

        transform:
        translate3d(0,-500px,300px)
        scale(1.9);

        opacity:0;
    }
}

/* ========================= */
/* 手机自适应 */
/* ========================= */

@media (max-width:768px){

body{

    min-width:100vw;
    min-height:100vh;

    overflow:auto;
}

body::before{

    inset:10px;

    border-radius:26px;

    box-shadow:
    inset 0 0 60px rgba(255,255,255,0.45);
}

.header{

    top:28px;
    left:26px;
}

.title{

    font-size:48px;

    letter-spacing:1px;

    line-height:1.1;
}

.search-box{

    margin-top:14px;

    width:180px;
    height:34px;

    border-radius:20px;

    padding-left:16px;

    font-size:15px;
}

.tip{

    top:88px;
    right:24px;

    font-size:12px;

    letter-spacing:1px;
}

.song-area{

    width:100vw;
    height:1800px;
}

.song:hover{

    transform:none;

    text-shadow:none;

    filter:none;
}

/* 手机点击效果 */

.song:active{

    transform:
    scale(1.3);

    color:#f1d9ff;

    opacity:1;

    text-shadow:

    0 0 10px rgba(255,255,255,1),

    0 0 20px rgba(232,190,255,1),

    0 0 40px rgba(214,170,255,0.9);
}

.small{

    font-size:14px;
    opacity:0.34;
}

.medium{

    font-size:22px;
    opacity:0.58;
}

.large{

    font-size:34px;
    opacity:0.75;
}

.note{

    opacity:0.22;
}

/* 手机音符 */

@keyframes musicMove{

    0%{

        transform:
        translate3d(0,260px,-900px)
        scale(0.15);

        opacity:0;
    }

    20%{

        opacity:0.12;
    }

    50%{

        opacity:0.42;
    }

    100%{

        transform:
        translate3d(0,-520px,700px)
        scale(2.2);

        opacity:0;
    }
}

}

</style>
</head>

<body>

<div class="header">

    <div class="title">
        笨笨的の歌单
    </div>

    <input
    class="search-box"
    id="searchInput"
    placeholder="试试搜索">

</div>

<div class="tip">
    点击歌名可以试听～
</div>

<div class="song-area" id="songArea"></div>

<script>

const songs = [

"末日","走马","天赋","空空","半壶纱",
"要爱我","失眠了","小公主","after17",
"野火一季","心愿便利贴","梁山伯与朱丽叶",
"AlwaysOnline","你的crush降临了吗",
"绿色","爱我你就抱抱我","那时雨",
"东京不太热","一滴泪的时间",
"夏天的风","怪我咯","虚拟","宠坏",
"不要忘记我爱你","树的花语",
"奇妙能力歌","左手右手",
"天龙八部之宿敌","南泥湾",
"越来越不懂","公主殿下","宝贝",
"有雨有雨","粉雾海","宠爱",
"红昭愿","Doll","日不落","怎么了",
"我们","红色高跟鞋","关键词",
"怪物","第57次取消发送",
"凑热闹","嗯哼","不怕",
"如果爱忘了","摆",
"几分之几","take me hand"

];

const songArea =
document.getElementById("songArea");

/* 歌名 */

songs.forEach(songName=>{

    const song =
    document.createElement("div");

    const random =
    Math.random();

    let sizeClass = "small";

    if(random > 0.7){
        sizeClass = "medium";
    }

    if(random > 0.92){
        sizeClass = "large";
    }

    song.className =
    "song " + sizeClass;

    song.innerText =
    songName;

    /* 更集中 */

    const x =
    220 + Math.random()*1500;

    const y =
    230 + Math.random()*1200;

    song.style.left =
    x + "px";

    song.style.top =
    y + "px";

    /* 动快一点 */

    song.style.animationDuration =
    10 + Math.random()*8 + "s";

    song.onclick = ()=>{

        window.location.href =
        "song.html?song=" +
        encodeURIComponent(songName);
    };

    songArea.appendChild(song);
});

/* 搜索 */

document
.getElementById("searchInput")
.addEventListener("keypress",function(e){

    if(e.key==="Enter"){

        const value =
        this.value.trim();

        if(songs.includes(value)){

            window.location.href =
            "song.html?song=" +
            encodeURIComponent(value);

        }else{

            alert(
            "不好意思 笨笨的还没学会《"
            + value +
            "》 已加入待学歌单～"
            );
        }
    }
});

/* 音符 */
/* 数量更多 */
/* 更快 */

for(let i=0;i<95;i++){

    const note =
    document.createElement("div");

    note.className = "note";

    const symbols =
    ["♪","♫","♬","♩","𝄞"];

    note.innerText =
    symbols[
    Math.floor(
    Math.random()*symbols.length
    )];

    note.style.left =
    Math.random()*2200 + "px";

    note.style.top =
    Math.random()*1900 + "px";

    note.style.fontSize =
    16 + Math.random()*55 + "px";

    note.style.animationDuration =
    8 + Math.random()*8 + "s";

    songArea.appendChild(note);
}

</script>

</body>
</html>
