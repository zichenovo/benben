<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>笨笨的の歌单</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Noto+Serif+SC:wght@200;300;400&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{

    width:100%;
    height:100%;
    overflow:auto;
    scroll-behavior:smooth;
}

body{

    background:
    radial-gradient(circle at center,
    #f8f3ff 0%,
    #f7f1f6 35%,
    #f3f4ff 70%,
    #f9f6f8 100%);

    font-family:
    "Cormorant Garamond",
    "Noto Serif SC",
    serif;

    overflow:auto;
}

.world{

    position:relative;

    width:2200px;
    height:1700px;

    overflow:hidden;
}

.soft-light{

    position:absolute;

    width:900px;
    height:900px;

    background:
    radial-gradient(circle,
    rgba(225,220,255,0.28),
    transparent 70%);

    left:50%;
    top:50%;

    transform:
    translate(-50%,-50%);

    filter:blur(70px);

    pointer-events:none;
}

.title{

    position:absolute;

    top:90px;
    left:90px;

    font-size:82px;

    font-weight:300;

    color:#9d8d92;

    letter-spacing:4px;

    z-index:20;

    font-style:italic;
}

.search-box{

    position:absolute;

    top:210px;
    left:90px;

    width:260px;
    height:48px;

    border:none;

    border-radius:999px;

    padding:0 28px;

    font-size:17px;

    outline:none;

    background:
    rgba(255,255,255,0.55);

    backdrop-filter:blur(10px);

    color:#85787d;

    z-index:20;

    box-shadow:
    0 8px 30px rgba(230,220,230,0.25);
}

.search-box::placeholder{
    color:#b8aeb3;
}

.tip{

    position:absolute;

    top:110px;
    right:130px;

    font-size:24px;

    color:#ceb8ff;

    font-style:italic;

    letter-spacing:2px;

    z-index:20;
}

.song{

    position:absolute;

    cursor:pointer;

    transition:
    transform 1.5s ease,
    opacity 1.5s ease,
    text-shadow 1.5s ease;

    animation:
    floatSong 7s ease-in-out infinite;

    transform-origin:center;

    white-space:nowrap;
}

.song:hover{

    transform:
    scale(1.22)
    translateY(-10px);

    text-shadow:
    0 0 25px rgba(210,190,255,0.7);

    z-index:50;
}

.song a{

    text-decoration:none;
    font-weight:300;
}

.note{

    position:absolute;

    pointer-events:none;

    color:#eadfff;

    mix-blend-mode:screen;

    animation:
    depthFloat linear infinite;

    will-change:
    transform,
    opacity;
}

@keyframes floatSong{

    0%{
        transform:
        translateY(0px);
    }

    50%{
        transform:
        translateY(-12px);
    }

    100%{
        transform:
        translateY(0px);
    }
}

@keyframes depthFloat{

    0%{

        transform:
        translate3d(0,120px,-600px)
        scale(0.15)
        rotate(0deg);

        opacity:0;
    }

    20%{
        opacity:0.12;
    }

    60%{
        opacity:0.2;
    }

    100%{

        transform:
        translate3d(0,-120px,300px)
        scale(1.8)
        rotate(120deg);

        opacity:0;
    }
}

</style>
</head>

<body>

<div class="world" id="world">

<div class="soft-light"></div>

<div class="title">
笨笨的の歌单
</div>

<input
class="search-box"
id="searchInput"
placeholder="试试搜索"
/>

<div class="tip">
点击歌名可以试听～
</div>

</div>

<script>

const songs = [

"东京不太热",
"如果爱忘了",
"第57次取消发送",
"你的crush降临了吗",
"一滴泪的时间",
"红昭愿",
"心愿便利贴",
"公主殿下",
"夏天的风",
"怪物",
"野火一季",
"爱我你就抱抱我",
"宠坏",
"空空",
"左手右手",
"粉雾海",
"怎么了",
"Doll",
"AlwaysOnline",
"梁山伯与朱丽叶",
"失眠了",
"湊熱闹",
"有雨有雨",
"take me hand",
"末日不落",
"不要忘记我爱你",
"我们",
"绿色",
"南泥湾",
"小公主",
"宝贝",
"半壶纱",
"天赋"

];

const colors = [

"#d9c2ff",
"#c9d6ff",
"#f1c7f6",
"#cdb8ff",
"#bfcfff",
"#e3c7ff",
"#b8cfff",
"#ead2ff"

];

const world =
document.getElementById("world");

songs.forEach(song=>{

    const div =
    document.createElement("div");

    div.className="song";

    const size =
    18 + Math.random()*42;

    div.style.fontSize =
    size + "px";

    div.style.left =
    150 + Math.random()*1800 + "px";

    div.style.top =
    120 + Math.random()*1350 + "px";

    div.style.opacity =
    0.45 + Math.random()*0.45;

    div.style.animationDelay =
    (-Math.random()*8) + "s";

    const color =
    colors[
    Math.floor(
    Math.random()*colors.length
    )
    ];

    div.innerHTML = `

    <a href="song.html?song=${encodeURIComponent(song)}"
    style="color:${color}">
    ${song}
    </a>

    `;

    world.appendChild(div);
});

const musicElements = [

"♫",
"♪",
"♬",
"♩",
"𝄞",
"◌",
"◍",
"⊹",
"☾",
"♡"

];

for(let i=0;i<120;i++){

    const note =
    document.createElement("div");

    note.className = "note";

    note.innerHTML =
    musicElements[
    Math.floor(
    Math.random()*musicElements.length
    )
    ];

    note.style.left =
    Math.random()*2200 + "px";

    note.style.top =
    Math.random()*1700 + "px";

    note.style.fontSize =
    (10 + Math.random()*55) + "px";

    note.style.animationDuration =
    (3 + Math.random()*7) + "s";

    note.style.animationDelay =
    (-Math.random()*15) + "s";

    note.style.opacity =
    0.05 + Math.random()*0.18;

    note.style.filter =
    "blur(" + Math.random()*1.5 + "px)";

    world.appendChild(note);
}

const searchInput =
document.getElementById("searchInput");

searchInput.addEventListener("keydown",e=>{

    if(e.key==="Enter"){

        const value =
        searchInput.value.trim();

        if(songs.includes(value)){

            window.location.href =
            `song.html?song=${encodeURIComponent(value)}`;

        }else{

            alert(
            "不好意思 笨笨的还没学会这首歌～"
            );
        }
    }
});

</script>

</body>
</html>
