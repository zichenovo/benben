<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>笨笨的の歌单</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Noto+Serif+SC:wght@300;400&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    overflow:auto;

    width:100vw;
    height:100vh;

    background:
    radial-gradient(circle at center,
    rgba(236,232,255,0.78),
    rgba(250,246,248,1) 70%);

    font-family:
    'Cormorant Garamond',
    'Noto Serif SC',
    serif;
}

.world{

    position:relative;

    width:2200px;
    height:1700px;

    overflow:hidden;

    animation:
    worldBreath 14s ease-in-out infinite alternate;
}

@keyframes worldBreath{

    from{
        transform:scale(1);
    }

    to{
        transform:scale(1.02);
    }
}

.title{

    position:fixed;

    top:55px;
    left:60px;

    z-index:100;

    font-size:68px;

    font-weight:300;

    font-style:italic;

    color:#9e8f97;

    letter-spacing:2px;
}

.search{

    position:fixed;

    top:155px;
    left:60px;

    z-index:100;
}

.search input{

    width:240px;
    height:48px;

    border:none;
    outline:none;

    border-radius:999px;

    padding:0 22px;

    background:
    rgba(255,255,255,0.62);

    backdrop-filter:blur(10px);

    box-shadow:
    0 0 24px rgba(255,255,255,0.5);

    color:#a1939b;

    font-size:17px;

    font-family:
    'Noto Serif SC',
    serif;
}

.tip{

    position:fixed;

    top:120px;
    right:90px;

    z-index:100;

    font-size:24px;

    color:#d2b9ff;

    font-style:italic;
}

.song{

    position:absolute;

    text-decoration:none;

    font-weight:300;

    white-space:nowrap;

    transition:
    transform .8s ease,
    opacity .8s ease;

    animation:
    floaty ease-in-out infinite alternate;
}

.song:hover{

    transform:
    scale(1.08);

    opacity:1;
}

@keyframes floaty{

    from{

        transform:
        translateY(0px)
        translateX(0px);
    }

    to{

        transform:
        translateY(-12px)
        translateX(5px);
    }
}

.note{

    position:absolute;

    pointer-events:none;

    color:#eadfff;

    animation:
    depthFloat linear infinite;
}

@keyframes depthFloat{

    0%{

        transform:
        translateZ(-600px)
        scale(0.2);

        opacity:0;
    }

    20%{
        opacity:0.22;
    }

    100%{

        transform:
        translateZ(300px)
        scale(1.6);

        opacity:0;
    }
}

</style>
</head>

<body>

<div class="title">
笨笨的の歌单
</div>

<div class="search">
<input id="searchInput" placeholder="试试搜索">
</div>

<div class="tip">
点击歌名可以试听～
</div>

<div class="world" id="world"></div>

<script>

const songs = [

"东京不太热","怪物","宠坏","如果爱忘了","红色高跟鞋",
"第57次取消发送","爱我你就抱抱我","公主殿下","心愿便利贴",
"一滴泪的时间","Doll","你的crush降临了吗","天赋","有雨有雨",
"空空","半壶纱","我们","南泥湾","粉雾海","AlwaysOnline",
"绿色","怪我咯","左手右手","凑热闹","野火一季","红昭愿",
"宝贝","after17","梁山伯与朱丽叶","宠爱","失眠了",
"奇妙能力歌","夏天的风","走马","怎么了","末日不落",
"天龙八部之宿敌","不要忘记我爱你","几分之几","take me hand"

];

const colors = [

"#caa7ff",
"#b6c8ff",
"#d8b6ff",
"#c6b8d4",
"#adc6ff",
"#e0c2ff",
"#cdb6ff",
"#bfc9ef"

];

const world =
document.getElementById("world");

songs.forEach(song=>{

    const a =
    document.createElement("a");

    a.className="song";

    a.innerText=song;

    a.href=
    "song.html?song="+encodeURIComponent(song);

    a.style.left =
    Math.random()*1900 + "px";

    a.style.top =
    Math.random()*1450 + "px";

    a.style.fontSize =
    (18 + Math.random()*34) + "px";

    a.style.color =
    colors[Math.floor(Math.random()*colors.length)];

    a.style.opacity =
    0.45 + Math.random()*0.35;

    a.style.animationDuration =
    (4 + Math.random()*6) + "s";

    world.appendChild(a);
});

const symbols =
["♫","♪","♬","♩","𝄞"];

for(let i=0;i<90;i++){

    const note =
    document.createElement("div");

    note.className="note";

    note.innerHTML =
    symbols[Math.floor(Math.random()*symbols.length)];

    note.style.left =
    Math.random()*2200 + "px";

    note.style.top =
    Math.random()*1700 + "px";

    note.style.fontSize =
    (16 + Math.random()*40) + "px";

    note.style.animationDuration =
    (2 + Math.random()*5) + "s";

    note.style.animationDelay =
    (-Math.random()*10) + "s";

    note.style.opacity =
    Math.random()*0.18;

    world.appendChild(note);
}

document
.getElementById("searchInput")
.addEventListener("keypress",function(e){

    if(e.key==="Enter"){

        const value =
        this.value.trim();

        if(songs.includes(value)){

            window.location.href =
            "song.html?song="+encodeURIComponent(value);

        }else{

            alert(
            "不好意思 笨笨的还没学会这首歌～"
            );
        }
    }
});

</script>

</body>
</html>
